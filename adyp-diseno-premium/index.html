<!doctype html>
<html lang="es" data-concept="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ADYP · Prototipo premium A/B/C (auditoría + rediseño)</title>
<meta name="description" content="Prototipo interactivo zero-CDN del rediseño de ADYP: 3 conceptos visuales, todas las rutas y estados. Sin backend: todo simulado.">
<style>
/* ============================================================
   ADYP · PROTOTIPO DE DISEÑO — 1 archivo, 0 dependencias.
   No llama a ninguna API ni a Google Maps: todo es local.
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--ff-body);background:var(--bg);color:var(--tinta);
  font-size:var(--fs-body);line-height:1.55;letter-spacing:.01em;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
h1,h2,h3,h4,p,figure{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:var(--focus-w) solid var(--focus-c);outline-offset:2px;border-radius:var(--r-s)}
::selection{background:var(--sel-bg);color:var(--sel-fg)}
img{max-width:100%}

/* ---------- TOKENS COMPARTIDOS ---------- */
:root{
  --ff-display:"Fraunces","Iowan Old Style",Georgia,"Times New Roman",serif;
  --ff-body:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ff-num:"Outfit",var(--ff-body);
  --fs-micro:.72rem;--fs-xs:.8rem;--fs-sm:.9rem;--fs-body:1rem;--fs-md:1.1rem;
  --fs-lg:clamp(1.22rem,1.05rem+1vw,1.5rem);--fs-xl:clamp(1.5rem,1.25rem+1.6vw,2rem);
  --fs-2xl:clamp(1.9rem,1.5rem+2.6vw,2.7rem);--fs-3xl:clamp(2.4rem,1.7rem+4.4vw,3.9rem);
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:22px;--sp6:32px;--sp7:48px;--sp8:64px;
  --r-s:10px;--r-m:14px;--r-l:20px;--r-xl:26px;--r-pill:999px;
  --bar-h:64px;--hd-h:58px;--maxw:1180px;
  --ease:cubic-bezier(.22,.8,.22,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --t1:200ms;--t2:280ms;--t3:380ms;
  --hd-standoff:calc(var(--hd-h) + env(safe-area-inset-top,0px));
  --tab-standoff:calc(var(--bar-h) + env(safe-area-inset-bottom,0px));
}
/* ---------- CONCEPTO A · Glass minimalista ---------- */
html[data-concept="a"]{
  --bg:#f4f7f6;--wash:radial-gradient(900px 460px at 84% -12%,rgba(14,127,149,.10),transparent 62%),radial-gradient(760px 420px at -10% 8%,rgba(232,164,4,.12),transparent 58%),radial-gradient(700px 500px at 50% 120%,rgba(20,82,63,.06),transparent 60%);
  --papel:rgba(255,255,255,.78);--papel2:rgba(255,255,255,.6);--sink:rgba(20,23,21,.045);
  --tinta:#101714;--tinta2:#3d4b45;--tinta3:#68776f;--linea:rgba(16,23,20,.10);
  --pino:#14523f;--pino-soft:rgba(20,82,63,.10);--agua:#0e7f95;--agua-soft:rgba(14,127,149,.12);
  --sol:#9a6b00;--sol-bg:rgba(232,164,4,.16);--ok:#1c7a3f;--ok-soft:rgba(28,122,63,.12);
  --peligro:#b23a2c;--peligro-soft:rgba(178,58,44,.10);--coral:#c14e3d;
  --shadow:0 1px 2px rgba(16,23,20,.05),0 14px 34px -20px rgba(16,23,20,.28);
  --shadow-hi:0 2px 4px rgba(16,23,20,.06),0 22px 46px -22px rgba(16,23,20,.34);
  --r-card:24px;--r-chip:var(--r-pill);--r-input:16px;--r-sheet:30px;
  --focus-c:#e8a404;--focus-w:3px;--sel-bg:#14523f;--sel-fg:#fff;
  --glass:blur(22px) saturate(1.3);--border-btn:transparent;
  --tab-float:1;
}
/* ---------- CONCEPTO B · Comunidad vibrante ---------- */
html[data-concept="b"]{
  --bg:#fbf3e4;--wash:radial-gradient(820px 460px at 92% -14%,rgba(10,162,192,.12),transparent 55%),radial-gradient(760px 460px at -8% 6%,rgba(245,158,11,.14),transparent 55%);
  --papel:#ffffff;--papel2:#fffaf0;--sink:#f6ecd8;
  --tinta:#1d1505;--tinta2:#4e4127;--tinta3:#7d6c4d;--linea:#eedfc2;
  --pino:#0f6a4c;--pino-soft:#d9efe5;--agua:#0a8aa6;--agua-soft:#d9f0f6;
  --sol:#946008;--sol-bg:#fdeac2;--ok:#1f8a68;--ok-soft:#ddf3ea;
  --peligro:#c13a26;--peligro-soft:#fbe0da;--coral:#e05b4b;
  --shadow:0 2px 0 rgba(29,21,5,.05),0 18px 34px -22px rgba(29,21,5,.35);
  --shadow-hi:0 4px 0 rgba(29,21,5,.06),0 26px 46px -22px rgba(29,21,5,.42);
  --r-card:28px;--r-chip:var(--r-pill);--r-input:18px;--r-sheet:34px;
  --focus-c:#0f6a4c;--focus-w:3px;--sel-bg:#f59e0b;--sel-fg:#1d1505;
  --glass:none;--border-btn:transparent;--tab-float:0;
}
/* ---------- CONCEPTO C · Neo-editorial cálido ---------- */
html[data-concept="c"]{
  --bg:#faf6ec;--wash:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,0));
  --papel:#fffdf7;--papel2:#fffdf7;--sink:#f3ecdc;
  --tinta:#221a10;--tinta2:#54462f;--tinta3:#7a6650;--linea:#e3d8c6;
  --pino:#14523f;--pino-soft:#e9f2ee;--agua:#0f7188;--agua-soft:#e2f1f4;
  --sol:#8a5d00;--sol-bg:#f8ecd4;--ok:#1c7a3f;--ok-soft:#e9f5ec;
  --peligro:#a72d2d;--peligro-soft:#f7e6e0;--coral:#b23a2c;
  --shadow:0 1px 0 var(--linea);
  --shadow-hi:0 1px 0 var(--linea),0 14px 30px -22px rgba(36,21,5,.45);
  --r-card:18px;--r-chip:var(--r-s);--r-input:14px;--r-sheet:28px;
  --focus-c:#14523f;--focus-w:2px;--sel-bg:#f5c462;--sel-fg:#221a10;
  --glass:none;--border-btn:var(--linea);--tab-float:0;
  --fs-body:1.045rem;
}
html[data-concept="a"],html[data-concept="b"]{}
body{background:var(--bg);background-image:var(--wash);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:var(--wash);opacity:.9}
html[data-concept="c"] body::before{background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(36,21,5,.012) 3px 4px)}

/* ---------- TIPOGRAFÍA ---------- */
.display{font-family:var(--ff-display);font-weight:600;letter-spacing:-.015em;line-height:1.08}
html[data-concept="b"] .display{font-family:var(--ff-num);font-weight:800;letter-spacing:-.03em}
html[data-concept="c"] .display{font-weight:560;font-variation-settings:"SOFT" 40,"WONK" 1}
.eyebrow{font-size:var(--fs-micro);font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--tinta3);font-family:var(--ff-num)}
html[data-concept="b"] .eyebrow{color:var(--pino);letter-spacing:.09em}
.num{font-family:var(--ff-num);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--tinta2)} .dim{color:var(--tinta3)} .small{font-size:var(--fs-sm)}
.lead{font-size:var(--fs-md);color:var(--tinta2)}
.mark{background:linear-gradient(transparent 58%,var(--sol-bg) 58%)}
html[data-concept="a"] .mark{background:linear-gradient(transparent 60%,rgba(232,164,4,.35) 60%)}

/* ---------- LAYOUT ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
main.view{flex:1;width:100%;max-width:var(--maxw);margin:0 auto;
  padding:calc(var(--hd-h) + env(safe-area-inset-top,0px) + var(--sp4)) var(--sp4) calc(var(--tab-standoff) + var(--sp6));
  width:min(100%,var(--maxw));animation:viewIn var(--t3) var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pad-x{padding-inline:var(--sp4)}
.wrap{width:min(100% - var(--sp6),660px);margin-inline:auto}
.wrap.wide{width:min(100% - var(--sp6),var(--maxw))}
.cols{display:grid;gap:var(--sp4)}
@media(min-width:700px){.cols.two{grid-template-columns:1fr 1fr}.cols.side{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}}
@media(min-width:1040px){main.view{padding-bottom:var(--sp7)}.cols.trio{grid-template-columns:repeat(3,1fr)}}
.stack{display:flex;flex-direction:column;gap:var(--sp3)}
.stack.lg{gap:var(--sp6)}
.row{display:flex;align-items:center;gap:var(--sp2)}
.row.wrap{flex-wrap:wrap}.row.sb{justify-content:space-between}.row.c{align-items:center}
.grid{display:grid;gap:var(--sp4);grid-template-columns:1fr}
@media(min-width:600px){.grid.g2{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1040px){.grid.g3{grid-template-columns:repeat(3,1fr)}.grid.g4{grid-template-columns:repeat(4,1fr)}}

/* ---------- CABECERA ---------- */
.hd{position:fixed;top:0;left:0;right:0;z-index:60;height:var(--hd-standoff);
  padding-top:env(safe-area-inset-top,0px);background:var(--papel);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border-bottom:1px solid var(--linea)}
html[data-concept="c"] .hd{background:var(--papel)}
.hd-in{max-width:var(--maxw);margin:0 auto;height:var(--hd-h);display:flex;align-items:center;gap:var(--sp2);padding-inline:var(--sp3)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--ff-display);font-weight:640;font-size:1.06rem;letter-spacing:-.01em}
html[data-concept="b"] .brand{font-family:var(--ff-num);font-weight:800}
.brand .lg{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--pino),var(--agua));color:#fff;font-size:.8rem;font-weight:800;box-shadow:0 4px 12px -4px rgba(20,82,63,.5)}
html[data-concept="c"] .brand .lg{border-radius:8px;background:var(--tinta);color:var(--papel)}
.hd .spacer{flex:1}
.hdnav{display:none}
@media(min-width:1040px){.hdnav{display:flex;gap:2px}.hdnav a{padding:8px 13px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:600;color:var(--tinta2)}
.hdnav a[aria-current="page"]{background:var(--pino);color:#fff}}
.iconbtn{width:44px;height:44px;min-width:44px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--tinta2);transition:background var(--t1),transform var(--t1) var(--spring)}
.iconbtn:hover{background:var(--sink)}
.iconbtn:active{transform:scale(.92)}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--coral);border:2px solid var(--papel)}
.iconbtn{position:relative}

/* ---------- TABBAR + FAB ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:grid;grid-template-columns:repeat(5,1fr);
  height:var(--bar-h);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--papel);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border-top:1px solid var(--linea)}
html[data-concept="a"] .tabbar{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));
  border:1px solid rgba(255,255,255,.65);border-radius:30px;box-shadow:var(--shadow);border-top:1px solid rgba(255,255,255,.65)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;
  font-size:.68rem;font-weight:700;color:var(--tinta3);transition:color var(--t1),transform var(--t1) var(--spring);position:relative}
.tabbar a svg{width:24px;height:24px}
.tabbar a:active{transform:scale(.94)}
.tabbar a[aria-current="page"]{color:var(--pino)}
html[data-concept="c"] .tabbar a{font-family:var(--ff-display);font-size:.74rem;font-weight:600}
.tabbar a[aria-current="page"]::before{content:"";position:absolute;top:2px;width:18px;height:3px;border-radius:3px;background:var(--pino)}
html[data-concept="a"] .tabbar a[aria-current="page"]::before,html[data-concept="b"] .tabbar a[aria-current="page"]::before{background:var(--sol)}
.tabbar .fabwrap{position:relative}
.tabbar .fab{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;background:linear-gradient(150deg,var(--sol),#c9860a);color:#231800;
  box-shadow:0 10px 22px -8px rgba(180,120,0,.55),0 0 0 5px var(--bg);transition:transform var(--t1) var(--spring)}
html[data-concept="a"] .tabbar .fab{background:linear-gradient(150deg,var(--agua),var(--pino));color:#fff;box-shadow:0 12px 26px -10px rgba(14,127,149,.6),0 0 0 5px var(--bg)}
html[data-concept="c"] .tabbar .fab{border-radius:14px;background:var(--tinta);color:var(--papel);box-shadow:0 0 0 5px var(--bg)}
.tabbar .fab svg{width:26px;height:26px}
.tabbar a:active .fab{transform:translateX(-50%) scale(.93)}
.tabbar .fabwrap span.lbl{margin-top:38px}
.tabbar .badge{position:absolute;top:-4px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--coral);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--papel)}
@media(min-width:1040px){.tabbar{display:none}}
@media(max-width:1039px){.desk-only{display:none!important}}
@media(min-width:1040px){.mob-only{display:none!important}}

/* ---------- BOTONES ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 var(--sp4);
  border-radius:var(--r-input);font-weight:700;font-size:var(--fs-sm);border:1.5px solid transparent;
  background:var(--pino);color:#fff;transition:transform var(--t1) var(--spring),box-shadow var(--t1),filter var(--t1),background var(--t1);
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.btn svg{width:18px;height:18px;flex:none}
html[data-concept="a"] .btn{border-radius:var(--r-pill);box-shadow:0 8px 18px -10px rgba(20,82,63,.5)}
html[data-concept="c"] .btn{border-radius:var(--r-s);background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
html[data-concept="b"] .btn:not(.ghost):not(.soft):hover{transform:translateY(-2px)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn .spin{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.btn.big{width:100%;min-height:54px;font-size:1.02rem}
.btn.ghost{background:transparent;color:var(--pino);border-color:var(--linea)}
html[data-concept="c"] .btn.ghost{color:var(--tinta);border-color:var(--linea)}
.btn.soft{background:var(--sink);color:var(--tinta)}
.btn.sol{background:var(--sol-bg);color:var(--sol)}
html[data-concept="a"] .btn.sol{background:linear-gradient(150deg,#f7c245,#e8a404);color:#241a00}
html[data-concept="b"] .btn.sol{background:linear-gradient(150deg,#fb0,#f59e0b);color:#231800;box-shadow:0 10px 20px -10px rgba(245,158,11,.6)}
.btn.danger{background:var(--peligro);color:#fff}
.btn.danger.ghost{background:var(--peligro-soft);color:var(--peligro)}
.btn.mini{min-height:38px;padding:0 14px;font-size:var(--fs-xs);border-radius:var(--r-pill)}
.btn.link{background:none;color:var(--agua);min-height:44px;padding:0 8px;font-weight:700;border-radius:var(--r-m)}
.btn.link:hover{text-decoration:underline}

/* ---------- CHIPS / PILLS / BADGES ---------- */
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:var(--r-chip);
  border:1.5px solid var(--linea);background:var(--papel);font-size:var(--fs-sm);font-weight:600;color:var(--tinta2);
  transition:transform var(--t1) var(--spring),background var(--t1),border-color var(--t1),color var(--t1);cursor:pointer;touch-action:manipulation}
.chip svg{width:15px;height:15px}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"],.chip.on{background:var(--pino);border-color:var(--pino);color:#fff}
html[data-concept="c"] .chip[aria-pressed="true"],html[data-concept="c"] .chip.on{background:var(--tinta);border-color:var(--tinta)}
html[data-concept="b"] .chip[aria-pressed="true"]{box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.chip .x{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.25)}
.chip .x svg{width:12px;height:12px}
.chip.sm{min-height:32px;padding:0 10px;font-size:var(--fs-xs)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:2px 11px;border-radius:var(--r-pill);
  font-size:var(--fs-xs);font-weight:800;letter-spacing:.02em;background:var(--sink);color:var(--tinta2)}
.pill svg{width:13px;height:13px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--sol-bg);color:var(--sol)}
.pill.danger{background:var(--peligro-soft);color:var(--peligro)}
.pill.info{background:var(--agua-soft);color:var(--agua)}
.pill.ink{background:var(--pino);color:#fff}
.pill.pulse{animation:pulse 1.6s var(--ease) infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px transparent}0%,100%{box-shadow:0 0 0 0 rgba(193,78,61,.35)}}
.badge-role{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:var(--r-pill)}
.badge-role.admin{background:var(--sol-bg);color:var(--sol)}
.badge-role.mod{background:var(--pino-soft);color:var(--pino)}
.badge-role.socio{background:var(--sink);color:var(--tinta3)}

/* ---------- TARJETAS ---------- */
.card{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r-card);box-shadow:var(--shadow);
  padding:var(--sp4);transition:transform var(--t2) var(--ease),box-shadow var(--t2)}
.card.flat{box-shadow:none}
html[data-concept="b"] .card{border-width:2px}
html[data-concept="c"] .card{border-radius:var(--r-card);box-shadow:none;border:1px solid var(--linea)}
a.card:hover,button.card:hover,.card.hov:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
html[data-concept="c"] a.card:hover,html[data-concept="c"] .card.hov:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
.card:active{transform:translateY(0) scale(.995)}
.card .hd-card{display:flex;align-items:center;gap:var(--sp2);margin-bottom:var(--sp3)}
.divider{height:1px;background:var(--linea);border:0;margin:var(--sp4) 0}
/* Tarjeta de quedada */
.qcard{display:block;overflow:hidden;padding:0}
.qcard .cover{position:relative;height:132px;display:grid;place-items:center;color:#fff;overflow:hidden}
.qcard .cover .art{position:absolute;inset:0;opacity:.95}
.qcard .cover .glyph{width:44px;height:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));position:relative}
.qcard .cover .cat-ink{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.28}
.qcard .cover .when{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center;
  background:rgba(16,15,10,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;
  border-radius:var(--r-pill);padding:4px 12px;font-size:var(--fs-xs);font-weight:700}
.qcard .body{padding:var(--sp3) var(--sp4) var(--sp4)}
.qcard h3{font-size:var(--fs-md);font-weight:700;letter-spacing:-.01em;line-height:1.25;margin:4px 0 6px}
html[data-concept="c"] .qcard h3{font-family:var(--ff-display);font-weight:600}
.qcard .meta{display:flex;flex-wrap:wrap;gap:5px 12px;color:var(--tinta3);font-size:var(--fs-xs);font-weight:600}
.qcard .meta span{display:inline-flex;gap:5px;align-items:center}
.qcard .meta svg{width:13px;height:13px}
.qcard .foot{display:flex;align-items:center;justify-content:space-between;gap:var(--sp2);margin-top:var(--sp3)}
.aforo{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);font-weight:800}
.aforo .meter{width:74px;height:5px;border-radius:3px;background:var(--sink);overflow:hidden}
html[data-concept="a"] .aforo .meter,html[data-concept="c"] .aforo .meter{position:static}
.aforo .meter i{display:block;height:100%;border-radius:3px;background:var(--pino);transition:width var(--t3)}
.aforo.warn .meter i{background:var(--sol)} .aforo.full .meter i{background:var(--peligro)}
.aforo.open .meter i{background:repeating-linear-gradient(90deg,var(--agua) 0 6px,transparent 6px 10px);width:100%!important}
.aforo.ok .meter i,.aforo .meter i{min-width:3px}
html[data-concept="b"] .qcard .foot{border-top:2px dashed var(--linea);padding-top:var(--sp3)}
html[data-concept="c"] .qcard .cover{height:104px;border-radius:6px;margin:10px 10px 0}

  letter-spacing:.2em;font-weight:700;color:var(--tinta3);text-transform:uppercase}
.stamp{display:inline-grid;place-items:center;min-width:54px;height:54px;padding:0 8px;border-radius:50%;

@keyframes stampIn{0%{transform:rotate(-8deg) scale(1.6);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}

/* ---------- FORMULARIOS ---------- */
.campo{position:relative}
.campo input,.campo select,.campo textarea{width:100%;min-height:48px;background:var(--papel);color:var(--tinta);
  border:1.5px solid var(--linea);border-radius:var(--r-input);padding:19px 14px 7px;transition:border-color var(--t1),box-shadow var(--t1),background var(--t1)}
html[data-concept="c"] .campo input,html[data-concept="c"] .campo textarea,html[data-concept="c"] .campo select{border:0;border-bottom:1.5px solid var(--linea);border-radius:0;background:transparent;padding:20px 2px 7px}
.campo textarea{min-height:96px;resize:vertical;padding-top:22px;line-height:1.5}
.campo label{position:absolute;left:14px;top:14px;font-size:var(--fs-sm);color:var(--tinta3);pointer-events:none;
  transition:all var(--t1) var(--ease);font-weight:600}
html[data-concept="c"] .campo label{left:2px}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--pino);box-shadow:0 0 0 4px var(--pino-soft)}
html[data-concept="b"] .campo input:focus,html[data-concept="b"] .campo select:focus,html[data-concept="b"] .campo textarea:focus{border-color:var(--pino);box-shadow:0 0 0 4px var(--pino-soft)}
.campo input:focus+label,.campo input:not(:placeholder-shown)+label,
.campo textarea:focus+label,.campo textarea:not(:placeholder-shown)+label,
.campo select+label,.campo select:focus+label,.campo .lab-on{top:5px;font-size:var(--fs-micro);color:var(--pino);letter-spacing:.04em}
.campo.bad input,.campo.bad textarea,.campo.bad select{border-color:var(--peligro);box-shadow:0 0 0 4px var(--peligro-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.campo .help{font-size:var(--fs-xs);color:var(--tinta3);margin:6px 2px 0;display:flex;gap:6px;align-items:flex-start}
.campo .help svg{width:13px;height:13px;flex:none;margin-top:2px}
.campo .err{font-size:var(--fs-xs);color:var(--peligro);margin:6px 2px 0;font-weight:700;display:none;align-items:center;gap:6px}
.campo .err svg{width:13px;height:13px}
.campo.bad .err{display:flex}.campo.bad .help{display:none}
.campo .count{position:absolute;right:12px;top:7px;font-size:10.5px;font-weight:800;color:var(--tinta3);font-family:var(--ff-num)}
.campo .count.near{color:var(--sol)}.campo .count.over{color:var(--peligro)}
.campo .eye{position:absolute;right:6px;top:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--tinta3)}
.campo .eye:hover{background:var(--sink)}
.grid-form{display:grid;gap:var(--sp3);grid-template-columns:1fr}
@media(min-width:620px){.grid-form.f2{grid-template-columns:1fr 1fr}}
.fswitch{display:flex;align-items:center;justify-content:space-between;gap:var(--sp3);padding:12px 2px;min-height:56px;cursor:pointer}
.fswitch+.fswitch{border-top:1px dashed var(--linea)}
.fswitch .t{font-weight:700;font-size:var(--fs-sm)} .fswitch .d{font-size:var(--fs-xs);color:var(--tinta3);margin-top:2px;line-height:1.4}
.sw{flex:none;width:52px;height:32px;border-radius:var(--r-pill);background:var(--sink);border:1.5px solid var(--linea);position:relative;transition:background var(--t2)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--papel);box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform var(--t2) var(--spring)}
input:checked+.sw,.sw[aria-checked="true"]{background:var(--pino);border-color:var(--pino)}
input:checked+.sw::after,.sw[aria-checked="true"]::after{transform:translateX(20px)}
.fswitch input{position:absolute;opacity:0;width:1px;height:1px}
.cbx{display:flex;gap:12px;align-items:flex-start;min-height:48px;cursor:pointer;font-size:var(--fs-sm);line-height:1.45}
.cbx input{appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--linea);border-radius:8px;background:var(--papel);
  display:grid;place-items:center;transition:all var(--t1) var(--spring);margin-top:1px;cursor:pointer}
.cbx input:checked{background:var(--pino);border-color:var(--pino);transform:scale(1.05)}
.cbx input:checked::after{content:"";width:12px;height:7px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.cbx.bad input{border-color:var(--peligro);animation:shake .35s}
.seg{display:grid;grid-auto-flow:column;background:var(--sink);border-radius:var(--r-pill);padding:4px;gap:2px;position:relative}
.seg button{min-height:40px;padding:0 14px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:700;color:var(--tinta2);transition:color var(--t1);z-index:1}
.seg button[aria-selected="true"]{color:var(--tinta)}
.seg .thumb{position:absolute;top:4px;bottom:4px;border-radius:var(--r-pill);background:var(--papel);box-shadow:0 2px 8px rgba(0,0,0,.12);transition:all var(--t2) var(--spring)}
html[data-concept="b"] .seg .thumb{background:var(--pino)} html[data-concept="b"] .seg button[aria-selected="true"]{color:#fff}
html[data-concept="c"] .seg{border-radius:var(--r-s);border:1px solid var(--linea)}
html[data-concept="c"] .seg .thumb{border-radius:8px;background:var(--tinta)}
html[data-concept="c"] .seg button[aria-selected="true"]{color:var(--papel)}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--linea);border-radius:var(--r-input);overflow:hidden;width:fit-content;background:var(--papel)}
.stepper button{width:48px;height:48px;font-size:1.2rem;font-weight:800;color:var(--pino);transition:background var(--t1)}
.stepper button:active{background:var(--pino-soft)}
.stepper input{width:74px;text-align:center;border:0;background:transparent;font-weight:800;font-family:var(--ff-num);font-size:1.05rem;min-height:48px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{appearance:none}

/* ---------- OVERLAY / SHEETS / MODALES ---------- */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(24,17,5,.46);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:grid;place-items:end center;opacity:0;animation:ovIn var(--t2) var(--ease) forwards}
@keyframes ovIn{to{opacity:1}}
.overlay.closing{animation:ovOut var(--t1) var(--ease) forwards} @keyframes ovOut{to{opacity:0}}
.sheet{width:min(600px,100%);max-height:min(var(--peek,70dvh),calc(100dvh - env(safe-area-inset-top,0px) - 10px));
  background:var(--papel);border-radius:var(--r-sheet) var(--r-sheet) 0 0;border:1px solid var(--linea);border-bottom:0;
  box-shadow:0 -18px 60px -24px rgba(20,15,5,.5);display:flex;flex-direction:column;
  transform:translateY(14px);opacity:0;animation:shIn var(--t3) var(--ease) forwards}
@keyframes shIn{to{transform:none;opacity:1}}
.overlay.closing .sheet{animation:shOut var(--t2) var(--ease) forwards} @keyframes shOut{to{transform:translateY(24px);opacity:0}}
.sheet[data-detent="expanded"]{max-height:min(var(--full,92dvh),calc(100dvh - env(safe-area-inset-top,0px) - 10px))}
.sheet .grab{padding:10px 14px 2px;display:flex;justify-content:center;touch-action:none;cursor:grab}
.sheet .grab i{width:44px;height:5px;border-radius:3px;background:var(--tinta3);opacity:.5;display:block;transition:opacity var(--t1)}
.sheet .grab:hover i{opacity:.9}
.sheet h2{font-size:var(--fs-md);padding:2px var(--sp5) 0;font-family:var(--ff-display);font-weight:640;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:var(--sp2)}
html[data-concept="b"] .sheet h2{font-family:var(--ff-num);font-weight:800}
.sheet .body{overflow:auto;padding:var(--sp3) var(--sp5) calc(var(--sp5) + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet .foot{padding:var(--sp3) var(--sp5) calc(var(--sp3) + env(safe-area-inset-bottom,0px));border-top:1px solid var(--linea);display:flex;gap:var(--sp2);background:var(--papel2);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:0 0 var(--r-sheet) var(--r-sheet)}
.sheet .foot .btn{flex:1}
@media(min-width:700px){
  .overlay{place-items:center;padding:var(--sp4)}
  .sheet{border-radius:var(--r-sheet);border-bottom:1px solid var(--linea);max-height:min(86dvh,860px)!important;
    width:min(600px,100%);box-shadow:0 30px 80px -24px rgba(20,15,5,.55);max-width:var(--dw,600px)}
  .sheet .grab{display:none}
  .sheet.wide{width:min(880px,100%)}
}
/* Confirmación centrada (respeta la allowlist v2: nunca es sheet) */
.overlay.centro{place-items:center;padding:var(--sp4)}
.overlay.centro .sheet{max-height:min(80dvh,640px)!important;width:min(460px,100%);border-bottom:1px solid var(--linea);border-radius:var(--r-sheet)}
.overlay.centro .sheet .grab{display:none}
.overlay.centro .alertico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:var(--sp4) auto 0}
.overlay.centro .alertico svg{width:26px;height:26px}

/* ---------- TOASTS ---------- */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + var(--sp2));left:50%;transform:translateX(-50%);z-index:90;
  display:flex;flex-direction:column;gap:8px;width:min(460px,calc(100vw - 24px));pointer-events:none}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--papel);border:1px solid var(--linea);border-radius:var(--r-m);
  padding:12px 14px;box-shadow:var(--shadow-hi);pointer-events:auto;animation:toastIn var(--t3) var(--spring);font-size:var(--fs-sm);font-weight:600;line-height:1.4;position:relative;overflow:hidden}
html[data-concept="b"] .toast{border-left:5px solid var(--pino)}
html[data-concept="c"] .toast{transform:rotate(-.4deg)}
.toast.out{animation:toastOut var(--t2) var(--ease) forwards}
@keyframes toastIn{from{transform:translateY(-14px) scale(.96);opacity:0}} @keyframes toastOut{to{transform:translateY(-10px);opacity:0}}
.toast svg.t-ic{width:20px;height:20px;flex:none;margin-top:1px}
.toast.ok svg.t-ic{color:var(--ok)} .toast.err svg.t-ic{color:var(--peligro)} .toast.info svg.t-ic{color:var(--agua)} .toast.warn svg.t-ic{color:var(--sol)}
.toast .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--pino);animation:shrink var(--dur,4s) linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
.toast .x{margin-left:auto;color:var(--tinta3);width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.toast .x:hover{background:var(--sink)}

/* ---------- ESTADOS: skeleton / vacío / error ---------- */
.sk{position:relative;overflow:hidden;background:var(--sink);border-radius:var(--r-s)}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sk 1.15s infinite}
html[data-concept="b"] .sk::after,html[data-concept="c"] .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent)}
@keyframes sk{to{transform:translateX(100%)}}
.sk.t{height:14px}.sk.t.lg{height:22px}.sk.l{height:9px}.sk.img{height:132px;border-radius:var(--r-card) var(--r-card) 0 0}
.sk.card{height:190px;border-radius:var(--r-card)}
.empty{text-align:center;padding:var(--sp8) var(--sp5);color:var(--tinta2)}
.empty .art{width:96px;height:96px;margin:0 auto var(--sp4);border-radius:32px;display:grid;place-items:center;
  background:var(--pino-soft);color:var(--pino);animation:floaty 3.4s var(--ease) infinite}
html[data-concept="b"] .empty .art{background:var(--sol-bg);color:var(--sol);border-radius:50%}
html[data-concept="c"] .empty .art{background:transparent;border:1.5px solid var(--linea);border-radius:50%;color:var(--tinta2)}
@keyframes floaty{50%{transform:translateY(-7px)}}
.empty .art svg{width:44px;height:44px}
.empty h3{font-size:var(--fs-md);font-family:var(--ff-display);margin-bottom:6px}
.empty p{font-size:var(--fs-sm);max-width:34ch;margin:0 auto var(--sp4)}
.errorbox{display:flex;gap:var(--sp3);padding:var(--sp4);border-radius:var(--r-m);background:var(--peligro-soft);color:var(--peligro);align-items:flex-start}
.errorbox svg{width:22px;flex:none}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);background:var(--sol-bg);color:var(--sol);font-size:var(--fs-sm);font-weight:600;line-height:1.45}
.notice.info{background:var(--agua-soft);color:var(--agua)} .notice.solid{background:var(--pino);color:#fff}
.notice svg{width:18px;flex:none;margin-top:1px}
.sim-tag{display:inline-flex;gap:5px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--agua);background:var(--agua-soft);padding:3px 9px;border-radius:var(--r-pill)}
.sim-tag svg{width:12px;height:12px}

/* ---------- AVATARES / LISTAS ---------- */
.avatar{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.92rem;color:#fff;
  font-family:var(--ff-num);box-shadow:inset 0 -6px 12px rgba(0,0,0,.15);position:relative}
.avatar.ring-adm{outline:2.5px solid var(--sol);outline-offset:2px} .avatar.ring-mod{outline:2.5px solid var(--pino);outline-offset:2px}
.avatar.sm{width:30px;height:30px;font-size:.7rem} .avatar.xl{width:76px;height:76px;font-size:1.5rem}
.avatar .st{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2.5px solid var(--papel)}
.list-item{display:flex;gap:var(--sp3);align-items:center;padding:12px var(--sp4);border-radius:var(--r-m);min-height:64px;transition:background var(--t1)}
a.list-item:hover,button.list-item:hover{background:var(--sink)}
.list-item .ic{width:42px;height:42px;border-radius:var(--r-m);display:grid;place-items:center;flex:none;background:var(--pino-soft);color:var(--pino)}
.list-item .ic svg{width:20px;height:20px}
.list-item .tx{flex:1;min-width:0}
.list-item .tx b{display:block;font-size:var(--fs-sm)} .list-item .tx span{font-size:var(--fs-xs);color:var(--tinta3)}
.list-item .chev{color:var(--tinta3)}

/* ---------- BARRA DE ACCIÓN FIJA (ficha) ---------- */
.actionbar{position:fixed;left:0;right:0;bottom:var(--bar-h);z-index:55;padding:10px var(--sp4) calc(10px);
  background:var(--papel);border-top:1px solid var(--linea);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  display:flex;gap:var(--sp2);max-width:var(--maxw);margin-inline:auto;
  transform:translateY(0)}
html[data-concept="a"] .actionbar{left:10px;right:10px;border:1px solid var(--linea);border-radius:22px;bottom:calc(var(--bar-h) + 8px);box-shadow:var(--shadow)}
.actionbar .btn{flex:1}
main.has-action{padding-bottom:calc(var(--tab-standoff) + 86px)}
main.view.full{padding:0 0 calc(var(--tab-standoff) + 16px)}
main.view.full .wrap{padding-inline:0;max-width:760px;width:100%}
main.view.full .ficha-body{padding-inline:var(--sp4)}
@media(min-width:700px){main.view.full .hero-ficha{border-radius:var(--r-xl)!important;margin:calc(env(safe-area-inset-top,0px) + 66px) var(--sp4) 0}}
@media(min-width:1040px){.actionbar{display:none!important}main.has-action{padding-bottom:var(--sp7)}}

/* ---------- MAPA ---------- */
.map-shell{position:relative;border-radius:var(--r-card);overflow:hidden;border:1px solid var(--linea);background:#eef3f0;height:min(66dvh,540px);box-shadow:var(--shadow)}
.map-shell svg.map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.map-shell svg.map:active{cursor:grabbing}
.map-ui{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
.map-ui button{width:44px;height:44px;border-radius:14px;background:var(--papel);border:1px solid var(--linea);box-shadow:var(--shadow);display:grid;place-items:center}
.map-ui button:active{transform:scale(.92)}
.map-ui svg{width:20px;height:20px;color:var(--tinta2)}
.map-legend{position:absolute;left:10px;bottom:10px;z-index:5;background:var(--papel);border:1px solid var(--linea);border-radius:16px;
  padding:8px 12px;font-size:var(--fs-xs);font-weight:700;box-shadow:var(--shadow);display:flex;gap:10px;flex-wrap:wrap;max-width:min(420px,72%)}
.map-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px}
.map-note{position:absolute;left:10px;top:10px;z-index:5}
.pin{cursor:pointer;transition:transform var(--t1) var(--spring)}
.pin:hover,.pin:focus-visible{transform:scale(1.25)}
.pin .hit{fill:transparent}
.pin.pop{animation:pinIn .5s var(--spring)} @keyframes pinIn{0%{transform:translateY(-14px) scale(.4);opacity:0}}
.cluster-lbl{font-family:var(--ff-num);font-weight:800;fill:#fff;font-size:12px;pointer-events:none}

/* ---------- TABLA ADMIN ---------- */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--linea);border-radius:var(--r-card);background:var(--papel);box-shadow:var(--shadow)}
table.tabla{width:100%;border-collapse:collapse;font-size:var(--fs-sm);min-width:640px}
table.tabla th{text-align:left;padding:12px 14px;font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.1em;color:var(--tinta3);border-bottom:1px solid var(--linea);white-space:nowrap;position:sticky;top:0;background:var(--papel)}
table.tabla td{padding:12px 14px;border-bottom:1px dashed var(--linea);vertical-align:middle}
table.tabla tr:last-child td{border-bottom:0}
table.tabla tbody tr{transition:background var(--t1)}
table.tabla tbody tr:hover{background:var(--sink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:var(--fs-sm)}
.kv dt{color:var(--tinta3);font-weight:600}.kv dd{margin:0;font-weight:700}
.kpi{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r-card);padding:var(--sp4);box-shadow:var(--shadow)}
.kpi .v{font-family:var(--ff-num);font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi .l{font-size:var(--fs-xs);color:var(--tinta3);font-weight:700;margin-top:6px;display:flex;gap:6px;align-items:center}
.kpi .delta{font-size:var(--fs-xs);font-weight:800;margin-top:4px}
.kpi .delta.up{color:var(--ok)} .kpi .delta.down{color:var(--peligro)}
.dl-note{font-size:var(--fs-xs);color:var(--tinta3)}

/* ---------- SECCIONES / VISTAS ---------- */
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp2);margin:var(--sp6) 0 var(--sp3)}
.sec-title h2{font-size:var(--fs-lg);font-family:var(--ff-display);font-weight:620;letter-spacing:-.01em}
html[data-concept="b"] .sec-title h2{font-family:var(--ff-num);font-weight:800}
html[data-concept="c"] .sec-title h2::after{content:"";display:block;width:44px;height:3px;border-radius:2px;background:var(--sol);margin-top:8px}
.sec-title a{font-size:var(--fs-sm);font-weight:700;color:var(--agua)}
.hero{padding:var(--sp6) 0 var(--sp4)}
.hero .hi{font-size:var(--fs-3xl)}
.hero .sub{color:var(--tinta2);max-width:52ch;margin-top:10px;font-size:var(--fs-md)}
@media(min-width:1040px){.hero{padding:var(--sp7) 0 var(--sp5)}}
.rail{display:flex;gap:var(--sp3);overflow-x:auto;padding:6px var(--sp4) var(--sp3);scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-inline:calc(var(--sp4)*-1)}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start;flex:0 0 min(320px,84%)}
@media(min-width:1040px){.rail>*{flex:0 0 336px}}
.weekstrip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;overflow-x:auto;padding:var(--sp2) 0;scrollbar-width:none}
.weekstrip::-webkit-scrollbar{display:none}
.day{min-width:52px;min-height:58px;border-radius:var(--r-m);border:1.5px solid var(--linea);background:var(--papel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-weight:700;font-size:var(--fs-xs);color:var(--tinta2);transition:all var(--t1)}
.day small{text-transform:uppercase;font-size:10px;letter-spacing:.08em;color:var(--tinta3);font-weight:800}
.day b{font-size:1.05rem;font-family:var(--ff-num)}
.day i{width:5px;height:5px;border-radius:50%;background:var(--sol);opacity:0}
.day[data-dot] i{opacity:1}
.day:active{transform:scale(.94)}
.day[aria-pressed="true"]{background:var(--pino);border-color:var(--pino);color:#fff}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] i{color:#fff}
.day[aria-pressed="true"] i{background:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font-size:10px;font-weight:800;color:var(--tinta3);text-transform:uppercase;padding:6px 0}
.cal-cell{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm);min-height:40px;position:relative;transition:all var(--t1)}
.cal-cell:hover{background:var(--sink)}
.cal-cell i{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal-cell i b{width:4px;height:4px;border-radius:50%;background:var(--pino)}
.cal-cell[aria-pressed="true"]{background:var(--pino);color:#fff}.cal-cell[aria-pressed="true"] i b{background:#fff}
.cal-cell.today{outline:2px solid var(--sol);outline-offset:-2px;font-weight:800}
.cal-cell.off{opacity:.35;pointer-events:none}
/* Ficha quedada */
.ficha-hero{position:relative;border-radius:0 0 var(--r-xl) var(--r-xl);color:#fff;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;padding:var(--sp6) var(--sp4) var(--sp4);overflow:hidden}
main>section.hero-ficha{margin-top:calc((var(--hd-standoff) + var(--sp4))*-1 - var(--hd-h)*0)}
.ficha-hero .art{position:absolute;inset:0}
.ficha-hero h1{font-family:var(--ff-display);font-size:var(--fs-2xl);font-weight:640;letter-spacing:-.015em;position:relative;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.ficha-hero .sub{position:relative;font-weight:600;opacity:.95;display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:var(--fs-sm)}
.ficha-body{max-width:720px;margin:0 auto;padding:var(--sp5) var(--sp4) var(--sp8)}
.blk{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r-card);padding:var(--sp4);box-shadow:var(--shadow);margin-bottom:var(--sp4)}
html[data-concept="c"] .blk{box-shadow:none}
.blk h3{font-size:var(--fs-sm);font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--tinta3);margin-bottom:10px;display:flex;gap:8px;align-items:center;font-family:var(--ff-num)}
.blk h3 svg{width:16px;height:16px;color:var(--pino)}
html[data-concept="c"] .blk h3{color:var(--sol)}
.blk p{line-height:1.6}
.dropcap p::first-letter{font-family:var(--ff-display);font-size:2.6em;float:left;line-height:.85;padding:4px 6px 0 0;font-weight:640;color:var(--pino)}
.att-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--linea);font-size:var(--fs-sm)}
.att-row:last-child{border:0}
.carpool{display:flex;gap:var(--sp2);flex-wrap:wrap}
.seatdot{width:14px;height:14px;border-radius:5px;border:2px solid var(--pino);display:inline-block}
.seatdot.taken{background:var(--pino)} .seatdot.free{border-style:dashed;border-color:var(--tinta3)}
.progress-steps{display:flex;gap:6px;margin:var(--sp3) 0}
.progress-steps i{height:5px;flex:1;border-radius:3px;background:var(--sink);transition:background var(--t2)}
.progress-steps i.on{background:var(--pino)}
/* Login */
.auth{min-height:100dvh;display:grid;place-items:center;padding:var(--sp4)}
.auth-card{width:min(480px,100%);background:var(--papel);border:1px solid var(--linea);border-radius:var(--r-xl);
  padding:var(--sp6) var(--sp5);box-shadow:var(--shadow-hi);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
.brand-lg{width:76px;height:76px;margin:0 auto var(--sp4);border-radius:26px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(150deg,var(--pino),var(--agua) 70%,var(--sol));box-shadow:0 18px 40px -16px rgba(20,82,63,.55);
  animation:logoIn .8s var(--spring) both}
@keyframes logoIn{from{transform:scale(.6) rotate(-8deg);opacity:0}}
.brand-lg svg{width:40px;height:40px}
html[data-concept="c"] .brand-lg{border-radius:16px;background:var(--tinta)}
/* Moderación */
.mod-item{border:1px solid var(--linea);border-radius:var(--r-card);background:var(--papel);padding:var(--sp4);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.mod-item .detect{display:flex;flex-wrap:wrap;gap:6px}
.mod-actions{display:flex;gap:8px;flex-wrap:wrap}
.mod-actions .btn{flex:1 1 130px}
.code-box{font-family:var(--ff-num);font-weight:800;letter-spacing:.35em;font-size:1.3rem;text-align:center;padding:14px;
  background:var(--sink);border-radius:var(--r-m);border:1.5px dashed var(--linea)}
/* Admin */
.admin-wrap{display:grid;gap:var(--sp4)}
@media(min-width:1040px){.admin-wrap{grid-template-columns:220px minmax(0,1fr)}}
.admin-side{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.admin-side::-webkit-scrollbar{display:none}
@media(min-width:1040px){.admin-side{flex-direction:column;position:sticky;top:calc(var(--hd-standoff) + var(--sp3))}}
.admin-side a{white-space:nowrap;padding:10px 15px;border-radius:var(--r-pill);font-weight:700;font-size:var(--fs-sm);color:var(--tinta2);border:1.5px solid transparent;transition:all var(--t1)}
.admin-side a[aria-current="page"]{background:var(--pino);color:#fff}
html[data-concept="c"] .admin-side a{border-radius:var(--r-s)}
html[data-concept="c"] .admin-side a[aria-current="page"]{background:var(--tinta);border-color:var(--tinta)}
.admin-side a:not([aria-current="page"]):hover{background:var(--sink)}
.danger-zone{border:2px solid var(--peligro)!important}
/* Prompt */
.prompt-box{background:var(--sink);border:1px solid var(--linea);border-radius:var(--r-m);padding:var(--sp4);max-height:56dvh;overflow:auto}
.prompt-box pre{margin:0;white-space:pre-wrap;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;color:var(--tinta2);word-break:break-word}
/* Concept switcher */
.conceptdock{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(50% - 74px);z-index:65;display:flex;flex-direction:column;gap:4px;
  background:var(--papel);border:1px solid var(--linea);border-radius:var(--r-pill);padding:5px;box-shadow:var(--shadow-hi);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
.conceptdock button{width:40px;height:40px;border-radius:50%;font-weight:800;font-family:var(--ff-num);font-size:13px;color:var(--tinta2);display:grid;place-items:center;transition:all var(--t1) var(--spring)}
.conceptdock button[aria-pressed="true"]{background:var(--tinta);color:var(--papel);transform:scale(1.05)}
.conceptdock button .lbl{display:none}
.conceptdock .lab{font-size:8px;letter-spacing:.12em;text-align:center;font-weight:800;color:var(--tinta3);text-transform:uppercase}
@media(max-width:1039px){.conceptdock{top:auto;bottom:calc(var(--tab-standoff) + 10px);right:10px;flex-direction:row}}
@media(min-width:1040px){.conceptdock{right:calc(50vw - var(--maxw)/2 - 66px);}}
/* Demo banner */
.demobar{font-size:var(--fs-xs);text-align:center;padding:6px 12px calc(6px);background:var(--tinta);color:var(--papel);font-weight:600;
  padding-top:calc(6px + env(safe-area-inset-top,0px))}
.demobar b{color:var(--sol-bg)}
main.view{padding-top:calc(var(--hd-standoff) + var(--hd-h)*0 + var(--sp4))}
/* Sheet handle hint & motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
html{scroll-behavior:smooth}
/* QR */
.qrbox{display:grid;place-items:center;gap:10px;padding:var(--sp4)}
.qrbox svg{border-radius:var(--r-m);background:#fff;padding:10px;box-shadow:var(--shadow)}
.tick{animation:tick .45s var(--spring)} @keyframes tick{from{transform:scale(0)}}
/* util */
.hide{display:none!important}
.center{text-align:center}
.grow{flex:1;min-width:0}
.tr{text-align:right}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;background:var(--sink);padding:2px 6px;border-radius:6px}
.w-full{width:100%}
</style>

# SYSTEM / MAIN PROMPT: ADYP - AUDITORÍA UX/UI, SISTEMA DE DISEÑO PREMIUM DINÁMICO Y PROTOTIPO INTERACTIVO COMPLETO

## ROL Y ESPECIALIDAD
Actúa como Lead UX/UI Architect & Principal Frontend Engineer especializado en Design Systems, aplicaciones web complejas (SPA) y diseño interactivo dinámico de alto impacto. Tu objetivo es auditar la web actual de ADYP, diseñar 3 conceptos visuales premium, dinámicos y modernos orientados a móvil/tablet, y construir un prototipo interactivo completo e independiente en un único archivo index.html.

## CONTEXTO Y FUENTES DE ENTRADA
- Web en Producción (Vista pública): https://adisfrutarypunto.alwaysdata.net/
- Copia pública de referencia HTML: https://adisfrutarypunto.alwaysdata.net/testdesign/index.html
- Condiciones del Entorno:
  - Trabaja exclusivamente con lo observable en estas URL.
  - La copia HTML es una referencia SPA compilada en React con estilos inlineados; la API PHP y Google Maps son dependencias externas.
  - Declara explícitamente cualquier componente o estado que no puedas verificar por falta de backend.
  - RESTRICCIÓN ABSOLUTA: No modifiques, publiques ni alteres la web original ni el entorno del servidor.

## OBJETIVO Y PARIDAD FUNCIONAL
Rediseña por completo la capa visual y la experiencia de usuario de ADYP para convertirla en una aplicación ultrapulida, moderna, dinámica y profesional, manteniendo al 100% la funcionalidad, rutas, validaciones, flujos, permisos y reglas de negocio existentes. Ninguna función real debe eliminarse ni convertirse en un mero adorno visual.

## REQUISITOS DE DISEÑO: MÓVIL Y TABLET (MOBILE-FIRST)
1. Ergonomía Táctil y Zonas de Pulgar:
   - Controles interactivos con superficie táctil mínima de 48x48px.
   - Navegación inferior fija (Bottom Navigation Bar) flotante o adosada con respuesta táctil inmediata.
   - Modales tipo Bottom-Sheet deslizables para móviles y diálogos flotantes para tablets.
2. Respeto a Interfaces Físicas:
   - Adaptación a áreas seguras safe-area-inset-* para acomodar notches, barras de estado e indicadores de inicio en teléfonos y tablets (orientación vertical y horizontal).
3. Componentes Dinámicos y Microinteracciones:
   - Feedback visual continuo: estados :hover, :active, :focus-visible, estados de carga mediante Skeleton Screens, notificaciones emergentes (Toast Alerts) y transiciones fluidas entre pantallas.
4. Identidad de Marca ADYP:
   - Conserva la esencia de comunidad cálida, el idioma español y la paleta/tipografía base (Fraunces, Plus Jakarta Sans, Outfit, tonos crema/papel, tinta oscura, turquesa y ámbar) o modernízala mediante propuestas alternativas respetuosas.
   - Respeta la capa móvil v2 activa (no recuperar la capa v1).

## FASE 1 — AUDITORÍA HEURÍSTICA Y DE ARQUITECTURA
1. Inventario Completo de Rutas:
   - Públicas/Socios: /, /entrada, /unirme, /agenda, /mapa, /quedada/:id, /quedada/nueva, /mis, /comunidad, /perfil.
   - Moderación y Administración: /moderacion y /admin/* (resumen, altas, socios, quedadas, auditoria, ajustes, datos).
2. Mapeo de Flujos y Formularios:
   - Detalla formularios, controles, modales, avisos, estados de validación y permisos por rol. Separa lo confirmado en el frontend de las suposiciones dependientes de la API backend.
3. Diagnóstico Responsive:
   - Evalúa comportamientos en móvil, tablet y escritorio. Identifica desbordamientos, textos tapados por barras fijas y deficiencias de accesibilidad (WCAG 2.1 AA).

## FASE 2 — PROPUESTAS VISUALES COMPLETAS (3 CONCEPTOS)
Presenta hasta 3 conceptos visuales claramente diferenciados, diseñados con enfoque Mobile-First y adaptados a tablet (vertical/horizontal) y escritorio secundario:
1. Concepto 1: Clean Minimalist & Glassmorphism Fluid (Líneas limpias, translúcidos pulidos, jerarquía tipográfica sofisticada).
2. Concepto 2: Vibrant Premium Community (Tarjetas elevadas, contrastes enérgicos, bordes suavizados, badges expresivos).
3. Concepto 3: Modern Warmth & Neo-Editorial (Aprovechamiento de la base crema/papel con un toque editorial contemporáneo y microinteracciones de alta fidelidad).

Para cada concepto define:
- Design Tokens: Paleta cromática semántica, escala tipográfica responsive, sistema de espaciado modular (grid de 8px), sombras/elevaciones.
- Componentes UI Dinámicos: Tarjetas de quedada con badges de aforo, chips de filtro activos, formularios con validaciones dinámicas e inputs flotantes, navegación táctil.
- Tabla Comparativa: Matriz de pros, contraste, velocidad percibida y densidad de información.

## FASE 3 — EJEMPLO INTERACTIVO Y PROTOTIPO NAVEGABLE
Genera un prototipo completo e independiente en un único archivo.

### Especificaciones Técnicas del Entregable:
- Archivo Único Autónomo: Guardado como adyp-diseno-premium/index.html.
- Zero-CDN / 100% Inline: Todo el HTML, CSS y JavaScript debe estar integrado en el archivo. No dependas de librerías externas ni fuentes/iconos CDN. Usa SVG inline para la iconografía y gráficos.
- Vanilla JS SPA Router: Enrutador cliente ligero que permita navegar entre todas las pantallas y la sección de administración sin recargar la página.
- Selector/Conmutador A/B/C: Permite alternar dinámicamente entre las 3 propuestas visuales en cualquier ruta de la aplicación.
- Interacciones Demostrativas:
  - Navegación interactiva por todas las rutas.
  - Simulador de filtros, pestañas, modales, confirmaciones y validaciones de formulario.
  - Simulador de estados: Carga (Skeleton screens), Vacío (Empty states), Error y Notificación Toast.
  - Mapa interactivo local simulado mediante SVG/CSS (aclarando la limitación en la UI).
  - Datos de demostración enriquecidos en español (sin usar fotos reales de socios/quedadas).
- Módulo «Prompt completo»: Incluye una pestaña/sección dedicada dentro del propio HTML con el texto íntegro de este prompt y un botón funcional «Copiar prompt» que lo copie al portapapeles.

## RESTRICCIONES Y REGLAS DE ENTREGA
1. Seguridad y Paridad: No expongas ni copies claves o datos reales. No alteres reglas ni permisos.
2. Autonomía: El archivo index.html debe abrirse y funcionar perfectamente al hacer doble clic localmente en cualquier navegador.
3. Transparencia: Si alguna funcionalidad no se ejecuta por falta de backend o Google Maps, señálalo explícitamente dentro de la interfaz del prototipo y en la respuesta final.

<script>
/* ================= COMPONENTES GLOBALES ================= */
const TICONS={ok:'check',err:'alert',info:'info',warn:'alert'};
function toast(txt,kind='ok',dur=4200){
  const el=document.createElement('div');el.className='toast '+kind;
  el.innerHTML=`${ic(TICONS[kind]||'info','t-ic')}<span>${txt}</span><button class="x" data-act="toast-close" aria-label="Cerrar aviso">${ic('x')}</button><i class="bar" style="--dur:${dur}ms"></i>`;
  $('#toasts').prepend(el);
  const kill=()=>{el.classList.add('out');setTimeout(()=>el.remove(),260)};
  const t=setTimeout(kill,dur);el._k=()=>{clearTimeout(t);kill()};
  return el;
}
const OVERLAYS=[];
function closeOverlay(ov){
  ov.classList.add('closing');OVERLAYS.splice(OVERLAYS.indexOf(ov),1);
  setTimeout(()=>ov.remove(),280);
}
function isMobile(){return matchMedia('(max-width: 699px)').matches}
function openSheet(o){
  /* o={kind:'info|form|filters|detail|confirm', title, body(html), foot(html), wide, dw, onMount, centro} */
  const ov=document.createElement('div');
  ov.className='overlay'+(o.centro||o.kind==='confirm'?' centro':'');
  const kind=o.centro?null:o.kind;
  const detents={filters:['56dvh','88dvh'],form:['78dvh','94dvh'],info:['62dvh','88dvh'],detail:['68dvh','93dvh']}[kind]||['70dvh','90dvh'];
  ov.innerHTML=`<div class="sheet${o.wide&&isMobile()?'':''}" role="dialog" aria-modal="true" aria-label="${esc(o.title||'panel')}"
     ${kind?'data-adyp-kind="'+kind+'"':''} data-detent="peek" style="--peek:${detents[0]};--full:${detents[1]};${o.dw?'--dw:'+o.dw+'px':''}">
    ${kind?`<button class="grab" type="button" aria-expanded="false" aria-label="Ampliar panel: ${esc(o.title||'')}"><i></i></button>`:''}
    ${o.title?`<h2><span>${o.title}</span>${kind?`<button class="iconbtn" data-act="sheet-close" aria-label="Cerrar">${ic('x')}</button>`:`<button class="iconbtn" data-act="sheet-close" aria-label="Cerrar">${ic('x')}</button>`}</h2>`:`<button class="iconbtn" data-act="sheet-close" aria-label="Cerrar" style="position:absolute;top:10px;right:10px">${ic('x')}</button>`}
    <div class="body">${o.body||''}</div>${o.foot?`<div class="foot">${o.foot}</div>`:''}</div>`;
  $('#overlay-root').appendChild(ov);OVERLAYS.push(ov);
  const sheet=$('.sheet',ov);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeOverlay(ov)});
  if(isMobile()&&kind){ /* arrastre del handle con dos detents (capa v2 + ampliada) */
    const g=$('.grab',sheet);let y0=null;
    g.addEventListener('pointerdown',e=>{y0=e.clientY;g.setPointerCapture(e.pointerId);sheet.style.transition='none'});
    g.addEventListener('pointermove',e=>{if(y0==null)return;const dy=Math.max(0,e.clientY-y0);sheet.style.transform=dy?`translateY(-${Math.min(40,dy*0.25)}px)`:'';if(e.clientY-y0<-46&&sheet.dataset.detent!=='expanded')setDetent(true);if(e.clientY-y0>46&&sheet.dataset.detent!=='peek')setDetent(false)});
    g.addEventListener('pointerup',e=>{if(y0==null)return;sheet.style.transition='';sheet.style.transform='';if(Math.abs(e.clientY-y0)<8)setDetent(sheet.dataset.detent!=='expanded');y0=null});
    g.addEventListener('click',e=>{if(e.target===g||e.target.tagName==='I')setDetent(sheet.dataset.detent!=='expanded')});
  }else{sheet.dataset.detent='expanded'}
  function setDetent(exp){sheet.dataset.detent=exp?'expanded':'peek';const g=$('.grab',sheet);if(g){g.setAttribute('aria-expanded',String(exp));g.setAttribute('aria-label',(exp?'Contraer':'Ampliar')+' panel: '+(o.title||''))}}
  const focusables=$$('button,a[href],input,select,textarea',sheet).filter(el=>!el.disabled);
  (focusables[0]||sheet).focus({preventScroll:true});
  sheet.tabIndex=-1;
  if(o.onMount)o.onMount(sheet,ov);
  requestAnimationFrame(()=>paintSegs(sheet));
  addEventListener('resize',()=>paintSegs(sheet),{once:true});
  return {sheet,ov,close:()=>closeOverlay(ov)};
}
document.addEventListener('click',e=>{

  if(t){const ov=t.closest('.overlay');if(ov)closeOverlay(ov)}
});

  if(e.key==='Escape'&&OVERLAYS.length)closeOverlay(OVERLAYS[OVERLAYS.length-1]);

function counter(inp,max){
  const f=inp.closest('.campo');const c=document.createElement('span');c.className='count';f.appendChild(c);
  const upd=()=>{const n=inp.value.length;c.textContent=n+'/'+max;c.className='count'+(n>max?' over':n>max*.85?' near':'')};
  inp.addEventListener('input',upd);upd();
}
function setBad(name,bad,msg){
  const f=$(`[data-f="${name}"]`);if(!f)return;
  f.classList.toggle('bad',!!bad);const er=$('.err',f);if(msg&&er)er.innerHTML=`${ic('alert')}<span>${msg}</span>`;
}
function fld(name,label,opts={}){
  /* input con label flotante + ayuda + error + contador opcional */
  const {type='text',ph=' ',help='',max,rows,val='',inputmode,step,min,list,required}=opts;
  const id='f_'+name;
  const tag=opts.textarea?`<textarea id="${id}" name="${name}" placeholder="${ph}" ${rows?'rows='+rows:''} ${max?'data-max="'+max+'"':''}>${esc(val)}</textarea>`
    :`<input id="${id}" name="${name}" type="${type}" placeholder="${ph}" value="${esc(val)}" ${inputmode?'inputmode="'+inputmode+'"':''} ${step?'step="'+step+'"':''} ${min!=null?'min="'+min+'"':''} ${max&&!opts.textarea?'maxlength="'+max+'"':''} ${list?'list="'+list+'"':''}>`;
  return `<div class="campo" data-f="${name}">${tag}<label for="${id}">${label}${required?' *':''}</label>
    ${opts.pw?`<button type="button" class="eye" data-act="pw-eye" aria-label="Mostrar contraseña">${ic('eye')}</button>`:''}
    ${help?`<div class="help">${ic('info')}<span>${help}</span></div>`:''}
    <div class="err"></div></div>`;

function parseHash(){

    <div class="kv"><dt>Dudas e incidencias</dt><dd>grupo de WhatsApp de la peña</dd><dt>Enlace de instalación</dt><dd><code>chat.whatsapp.com/REEMPLAZAR-POR-ENLACE-CADUCO</code></dd></div></div>`}));

/* ============ UNIRME ============ */
function vUnirme(){
  const steps=['Tus datos','Tu perfil','Normas'];
  const html=`
  <div class="wrap" style="padding-top:calc(var(--hd-standoff) + 10px)">
    <a class="btn link" href="#/entrada" style="margin-left:-8px">${ic('arrow-l')} Volver al acceso</a>
    <span class="eyebrow" style="display:block;margin-top:8px">Paso 1 de 3 · ${steps[0]}</span>
    <h1 class="display" style="font-size:var(--fs-2xl);margin:6px 0 4px">Unirme a la peña</h1>
    <p class="lead" style="margin-bottom:14px">Aquí empieza tu solicitud para entrar en la comunidad.</p>
    <div class="progress-steps" id="uw-steps"><i class="on"></i><i></i><i></i></div>
    <div class="card" style="margin-top:16px">
      <form id="frm-uw" novalidate class="stack" style="gap:14px">
        <div class="grid-form f2">
          ${fld('nombre','Nombre',{})} ${fld('apellidos','Apellidos',{})}
          ${fld('tel','Teléfono',{inputmode:'tel'})} ${fld('email','Correo (opcional)',{type:'email'})}
        </div>
        <div class="notice info">${ic('info')}<span>Es por donde te avisamos de las quedadas y de tu alta.</span></div>
        <button class="btn big" type="submit">Siguiente paso</button>
      </form>
    </div>
  </div>`;
  view.className='';view.innerHTML=html;
  let step=0;const form=$('#frm-uw',view);const body=$('.card',form.closest('main')||view);
  const draw=()=>{
    $$('#uw-steps i',view).forEach((el,i)=>el.classList.toggle('on',i<=step));
    $$('.eyebrow',view)[0].textContent='Paso '+(step+1)+' de 3 · '+steps[step];
  };
  form.addEventListener('submit',e=>{
    e.preventDefault();const f=e.target;let ok=true;
    if(step===0){
      const chk=[['nombre',v=>v.trim().length>1,'Pon al menos tu nombre.'],
                 ['apellidos',v=>v.length<=90,'Los apellidos no pueden pasar de 90 caracteres.'],
                 ['tel',v=>/^(\+34)?[6-9]\d{8}$/.test(v.replace(/[^0-9+]/g,'')),'Falta el teléfono: es el que usas para entrar y para las quedadas'],
                 ['email',v=>!v||/^\S+@\S+\.\S+$/.test(v),'Ese correo no parece válido (o déjalo vacío).']];
      ok=runChecks(f,chk);
      if(ok){step=1;
        $('.grid-form',f).innerHTML=`
          <div class="grid-form f2">${fld('naci','Fecha de nacimiento',{type:'date',val:'1990-05-05',help:'Al poner tu fecha te decimos en qué tramo encajas.'})}${fld('muni','Municipio',{})}</div>
          ${fld('pres','Preséntate en corto',{textarea:true,rows:4,help:'Máximo 600 caracteres. No es un sitio para convencer a nadie, es un sitio para pasarlo bien.',val:''})}
          <button class="btn big" type="submit">Siguiente paso</button>`;
        $('#frm-uw [name="naci"]',f)?.addEventListener('change',ev=>{const y=+ev.target.value.slice(0,4)||0;const t=y>1995?'18-30':'30-55';$('.help',$('[data-f="naci"]',f)).innerHTML=ic('info')+`<span>Tramo sugerido: <b>${t}</b> · ${y>1995?'Los que aún están estudiando o empezando':'El núcleo de la comunidad'}</span>`;});
        paintCounters(f);draw();
      }
    }else if(step===1){
      ok=runChecks(f,[['muni',v=>v.trim().length>1&&v.length<=60,'El municipio no puede pasar de 60 caracteres (ni puede faltar).'],['pres',v=>v.length<=600,'La presentación no puede pasar de 600 caracteres.']]);
      if(ok){step=2;
        f.innerHTML=`<label class="cbx" data-f="normas"><input type="checkbox" name="normas"><span>Acepto las <b>normas de la comunidad</b> (versión 10/2026): respeto, cancelar plaza si no vas, y nada de escribir por privado sin pie. <a href="#" data-act="normas-open" style="color:var(--agua);text-decoration:underline">Leer ahora</a></span></label>
        <div class="notice">${ic('shield')}<span>Tu solicitud pasa a la <b>cola del equipo</b>. Nadie entra directamente: una persona revisa que encajas con las normas y te da de alta.</span></div>
        <button class="btn big" type="submit">${ic('send')} Enviar solicitud</button>`;
        f.insertAdjacentHTML('afterbegin',`<div class="kv" style="margin:6px 0 14px"><dt>${esc(fv(f,'nombre')||'Pablo')}</dt><dd>${esc(fv(f,"tel"))} · ${esc(fv(f,"muni"))}</dd></div>`);
        draw();
      }
    }else{
      ok=runChecks(f,[['normas',()=>fc(f,"normas"),'Falta aceptar las normas: sin eso no hay alta.']]);
      if(ok){
        view.innerHTML=`<div class="wrap center" style="padding-top:calc(var(--hd-standoff) + 40px)"><div class="empty" style="padding:0"><div class="art" style="background:var(--ok-soft);color:var(--ok)">${ic('check')}</div>
        <h3>Solicitud en la cola del equipo</h3><p class="lead">Te avisaremos aquí mismo (y por WhatsApp) cuando alguien revise tu ficha. Si se aprueba, te damos una clave provisional de 6 dígitos que solo verás una vez el equipo.</p>
        <div class="stack" style="max-width:420px;margin:18px auto 0"><a class="btn" href="#/entrada">Volver al acceso</a><button class="btn ghost" data-act="uw-again">Rellenar otra solicitud (demo)</button></div></div></div>`;
        $("[data-act='uw-again']",view)?.addEventListener('click',render);
        toast('Solicitud enviada. Sin backend real: no viaja a ningún sitio.','info',5200);
      }
    }
    if(!ok)toast('No se pudo continuar. Repasa los datos marcados.','err');
  });
  view.addEventListener('click',e=>{if(e.target.closest('[data-act="normas-open"]')){e.preventDefault();normasSheet()}});
}
function runChecks(form,checks){
  let ok=true;
  for(const [name,fn,msg] of checks){
    const el=_el(form,name);if(!el)continue;
    const good=fn(el.value);
    $('[data-f="'+name+'"]',form.closest('.wrap')||document)?.classList.toggle('bad',!good);
    if(!good){ok=false;const er=$('[data-f="'+name+'"] .err',form.closest('.wrap')||document);if(er)er.innerHTML='<span>'+msg+'</span>';el.setAttribute('aria-invalid','true')}
    else el.removeAttribute('aria-invalid');
  }
  const bad=form.querySelector('.bad input:not(:checked), .bad input[aria-invalid="true"]');
  bad?.scrollIntoView({behavior:'smooth',block:'center'});
  return ok;
}
function paintCounters(form){
  $$('textarea[data-max]',form).forEach(t=>counter(t,+t.dataset.max));
}
function normasSheet(){
  openSheet({kind:'info',title:'Normas de la casa',
    body:`<div class="stack">${NORMAS.map((n,i)=>`<div class="row" style="gap:12px;align-items:flex-start"><span class="num" style="color:var(--sol);font-size:1.3rem">${i+1}</span><p class="small">${esc(n)}</p></div>`).join('')}</div>
    <p class="small dim" style="margin-top:14px">Las normas completas viven en <code>/comunidad → Normas de la casa</code>. Versión 10/2026.</p>`});
}

<script>
/* ============ AGENDA ============ */
function vAgenda(){
  if(!S.auth)return vEntrada();
  const f=S.filters;
  let list=EVENTS.filter(e=>abierto(e));
  if(f.q){const q=f.q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    list=list.filter(e=>(e.titulo+' '+e.desc+' '+e.lugar+' '+CATS[e.cat].n).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q))}
  if(f.cat)list=list.filter(e=>e.cat===f.cat);
  if(f.hueco)list=list.filter(e=>libres(e)>0);
  if(f.peques)list=list.filter(e=>e.peques===true);
  if(f.zona)list=list.filter(e=>e.z===f.zona);
  if(f.dia)list=list.filter(e=>e.fecha===f.dia);
  list.sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.hora<b.hora?-1:1));
  const diasSem=[];for(let i=0;i<14;i++)diasSem.push(addD(hoy.toISOString().slice(0,10),i));
  const dots=d=>EVENTS.filter(e=>abierto(e)&&e.fecha===d).length;
  const activeChips=[
    f.cat&&['cat','Categoría: '+CATS[f.cat].n],f.hueco&&['hueco','Solo con hueco'],f.peques&&['peques','Aptas peques'],
    f.zona&&['zona','Zona: '+f.zona],f.dia&&['dia','Día: '+fday(f.dia)],f.q&&['q','Búsqueda: “'+f.q+'”']
  ].filter(Boolean);
  const html=`
  <section class="wrap">
    <div class="row sb" style="align-items:flex-start">
      <div><span class="eyebrow">${list.length} plan${list.length===1?'':'es'} ${f.dia?'para '+fday(f.dia):'por delante'}</span>
      <h1 class="display" style="font-size:var(--fs-2xl)">Agenda</h1></div>
      <a class="btn sol" href="#/quedada/nueva">${ic('plus')}<span class="desk-only">Proponer una quedada</span></a>
    </div>
    <div class="row" style="gap:10px;margin-top:14px">
      <label class="campo grow" style="margin:0"><input id="ag-q" type="search" placeholder=" " value="${esc(f.q)}"><label for="ag-q">Buscar quedadas — «Maigmó», «cena», «Elche»…</label></label>
      <button class="chip" data-act="open-filtros">${ic('sliders')}Filtros${activeChips.length?`<span class="x" style="width:20px;height:20px;background:var(--pino);color:#fff">${activeChips.length}</span>`:''}</button>
      <button class="chip" data-act="open-cal" title="Abrir el calendario por meses">${ic('calendar')}</button>
    </div>
    <div class="weekstrip" style="margin-top:12px">${diasSem.map(d=>`<button class="day" data-act="pickday" data-d="${d}" aria-pressed="${f.dia===d}"><small>${fday(d).split(' ')[0]}</small><b>${D(d).getDate()}</b><i></i>${dots(d)?'<span style="position:absolute"></span>':''}</button>`.replace('<i></i>',dots(d)?'<i></i>':'<i style="visibility:hidden"></i>')).join('')}</div>
    <div class="rail" style="padding-bottom:4px">${activeChips.map(([k,l])=>`<span class="chip on" aria-pressed="true">${l}<button class="x" data-act="unsetf" data-k="${k}" aria-label="Quitar filtro ${l}">${ic('x')}</button></span>`).join('')}
    ${activeChips.length>1?`<button class="btn link" data-act="clearf">Limpiar todos</button>`:''}</div>
  </section>
  <section class="wrap">
    ${demoGate({
      ok:list.length?`<div class="grid g2">${list.map(e=>qcard(e)).join('')}</div>`:EMPTY('calendar','Nada por aquí… todavía 👀','No hay planes con ese filtro. Prueba a quitar la categoría, o mejor: propón tú el plan.'),
      sk:SKLIST(4),empty:EMPTY('calendar','Nada por aquí… todavía 👀','Prueba a quitar un día o un chip, o mejor: propón tú el plan.'),err:ERRLBL})}
  </section>`;
  shell(html,{back:false,title:''});
  $('#ag-q',view).addEventListener('input',e=>{S.filters.q=e.target.value;render();setTimeout(()=>{const q=$('#ag-q',view);q?.focus();q.setSelectionRange(99,99)},0)});
  $$('[data-act="pickday"]',view).forEach(b=>b.addEventListener('click',()=>{S.filters.dia=S.filters.dia===b.dataset.d?null:b.dataset.d;render()}));
  $$('[data-act="unsetf"]',view).forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;S.filters[k]=k==='hueco'||k==='peques'?false:null;if(k==='q')S.filters.q='';render()}));
  $('[data-act="clearf"]',view)?.addEventListener('click',()=>{S.filters={q:'',cat:null,hueco:false,peques:null,zona:null,dia:null};render()});
  $('[data-act="open-filtros"]',view)?.addEventListener('click',filtrosSheet);
  $('[data-act="open-cal"]',view)?.addEventListener('click',calSheet);
}
function filtrosSheet(){
  const f=S.filters;
  const body=`<div class="stack" style="gap:18px">
    <div><span class="eyebrow">Filtrar por categoría</span><div class="row wrap" style="margin-top:8px">${Object.entries(CATS).map(([k,c])=>`<button class="chip sm ${f.cat===k?'on':''}" data-fk="cat" data-v="${k}">${ic(c.i)}${c.n}</button>`).join('')}</div></div>
    <div><span class="eyebrow">Disponibilidad</span><div class="row wrap" style="margin-top:8px">
      <button class="chip sm ${f.hueco?'on':''}" data-fk="hueco">${ic('ticket')}Solo con hueco</button>
      <button class="chip sm ${f.peques?'on':''}" data-fk="peques">${ic('kids')}Aptas para peques</button></div></div>
    <div><span class="eyebrow">Filtrar por zona o ciudad</span><div class="row wrap" style="margin-top:8px">${Object.keys(COMARCAS).map(z=>`<button class="chip sm ${f.zona===z?'on':''}" data-fk="zona" data-v="${z}">${z}</button>`).join('')}</div></div>
    <p class="small dim">En la app estos filtros viajan a la query de la URL; aquí viven en memoria (misma lógica, menos backend).</p>
  </div>`;
  const {sheet,close}=openSheet({kind:'filters',title:'Filtrar la agenda',body,
    foot:`<button class="btn ghost" data-act="f-clean">Limpiar</button><button class="btn" data-act="f-apply">Ver ${EVENTS.filter(e=>abierto(e)).length} planes</button>`});
  sheet.addEventListener('click',e=>{const b=e.target.closest('[data-fk]');if(!b)return;
    const k=b.dataset.fk;const v=b.dataset.v;
    if(k==='cat')S.filters.cat=S.filters.cat===v?null:v;
    if(k==='zona')S.filters.zona=S.filters.zona===v?null:v;
    if(k==='hueco')S.filters.hueco=!S.filters.hueco;
    if(k==='peques')S.filters.peques=!S.filters.peques;
    b.classList.toggle('on');
    if(k==='zona'||k==='cat')[...b.parentElement.children].forEach(c=>{c.classList.toggle('on',c.dataset.v===S.filters[k])});
  });
  $('[data-act="f-clean"]',sheet)?.addEventListener('click',()=>{S.filters.cat=null;S.filters.hueco=false;S.filters.peques=false;S.filters.zona=null;render();close()});
  $('[data-act="f-apply"]',sheet)?.addEventListener('click',()=>{render();close();toast('Filtros aplicados (en la app, además se escriben en la URL).','ok',2600)});
}
let calMonth=new Date('2026-10-01T12:00:00');
function calSheet(){
  const render_=(sh)=>{
    const y=calMonth.getFullYear(),m=calMonth.getMonth();
    const first=new Date(y,m,1);const start=(first.getDay()+6)%7;
    const days=new Date(y,m+1,0).getDate();
    let cells='';
    for(let i=0;i<start;i++)cells+='<span></span>';
    for(let d=1;d<=days;d++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const n=EVENTS.filter(e=>abierto(e)&&e.fecha===iso).length;
      cells+=`<button class="cal-cell ${iso===hoy.toISOString().slice(0,10)?'today':''}" data-act="calpick" data-d="${iso}" aria-pressed="${S.filters.dia===iso}" aria-label="${d} de ${calMonth.toLocaleDateString('es-ES',{month:'long'})}, ${n} quedadas">${d}${n?`<i>${'<b></b>'.repeat(Math.min(n,3))}</i>`:''}</button>`;}
    $('.body',sh).innerHTML=`<div class="row sb" style="margin-bottom:10px">
      <button class="iconbtn" data-act="cal-prev" aria-label="Mes anterior">${ic('chev-l')}</button>
      <b class="display" style="font-size:1.05rem;text-transform:capitalize">${calMonth.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</b>
      <button class="iconbtn" data-act="cal-next" aria-label="Mes siguiente">${ic('chev-r')}</button></div>
      <div class="cal-grid">${'L M X J V S D'.split(' ').map(d=>`<span class="dow">${d}</span>`).join('')}${cells}</div>
      <p class="small dim center" style="margin-top:10px">El punto marca los días con quedadas · toca un día para filtrar la agenda</p>`;
  };
  const {sheet,close}=openSheet({kind:'filters',title:'Calendario de quedadas por meses',body:'',foot:`<button class="btn ghost" data-act="cal-today">Ir a hoy</button><button class="btn" data-act="cal-x">Cerrar</button>`});
  render_(sheet);
  sheet.addEventListener('click',e=>{
    if(e.target.closest('[data-act="cal-prev"]')){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);render_(sheet)}
    if(e.target.closest('[data-act="cal-next"]')){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);render_(sheet)}
    if(e.target.closest('[data-act="cal-today"]')){calMonth=new Date('2026-10-01T12:00:00');render_(sheet)}
    const pick=e.target.closest('[data-act="calpick"]');
    if(pick){S.filters.dia=pick.dataset.d;close();render();toast('Agenda filtrada por el día '+fday(pick.dataset.d),'ok',2200)}
    if(e.target.closest('[data-act="cal-x"]'))close();
  });
}

function miniMap(e){
  const x=66+(e.lng*-1)*22,y=52-(e.lat-38.3)*60;
  return `<svg viewBox="0 0 132 104" style="width:100%;height:100%" aria-label="Mapa esquemático del punto de encuentro">
    <rect width="132" height="104" fill="#e8efe9"/>
    <path d="M0 78 Q40 70 66 80 T132 74 V104 H0 Z" fill="#cfe4e8"/>
    <path d="M8 8c18 6 10 18 26 14" stroke="#b9cfc0" stroke-width="5" fill="none"/>
    <circle cx="${x}" cy="${y}" r="16" fill="rgba(20,82,63,.08)"/>
    <g class="pin pop"><path d="M${x} ${y-14}c-4.4 0-8 3.6-8 8 0 5.6 8 13 8 13s8-7.4 8-13c0-4.4-3.6-8-8-8Z" fill="${CATS[e.cat].c}"/><circle cx="${x}" cy="${y-6}" r="2.6" fill="#fff"/></g>
  </svg><span class="map-note sim-tag">${ic('info')} sim · esquemático</span>`;
}
function qrSVG(seed){
  let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967296};
  let cells='';const n=21;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const finder=(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
    if(finder)continue;
    if(rnd()>0.55)cells+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#101714"/>`;
  }
  const fin=(fx,fy)=>`<rect x="${fx}" y="${fy}" width="7" height="7" rx="1.6" fill="#101714"/><rect x="${fx+1}" y="${fy+1}" width="5" height="5" rx="1" fill="#fff"/><rect x="${fx+2}" y="${fy+2}" width="3" height="3" fill="#101714"/>`;
  return `<div class="qrbox"><svg viewBox="-1 -1 23 23" width="150" height="150" role="img" aria-label="Código QR simulado de acceso">
    <rect x="-1" y="-1" width="23" height="23" fill="#fff"/>${fin(0,0)}${fin(14,0)}${fin(0,14)}${cells}</svg></div>`;
}

        <div class="grid-form f2">

  view.className='';view.innerHTML=html;

  $('#f-cat',form).addEventListener('change',e2=>{const v=e2.target.value;
    $('#blk-montana',form).style.display=v==='montana'?'block':'none';
    const subs={montana:['Senderismo','Ciclismo y MTB','Escalada y ferratas'],agua:['Día de playa','Paddle surf','Buceo'],gastro:['Comidas y cenas','Catas','Picoteo'],ocio:['Tardeos','Juegos de mesa','Escape rooms'],deporte:['Pádel','Running','Ping pong'],cultura:['Museos','Teatro','Charlas'],viajes:['Escapada rural','Excursiones'],kids:['Parques','Talleres'],tecno:['Talleres','Quedadas de código'],idiomas:['Intercambio']};
    $('[data-f="sub"] label',form)?.classList.add('lab-on');
    sv(form,'sub','');_el(form,'sub').placeholder=' ';
    if(subs[v]){const dl=document.createElement('datalist');dl.id='subs';dl.innerHTML=subs[v].map(s=>`<option>${s}</option>`).join('');form.append(dl);_el(form,'sub').setAttribute('list','subs')}
  });
  $$('[data-seg="peques"] button',form).forEach(b=>b.addEventListener('click',()=>{$$('[data-seg="peques"] button',form).forEach(x=>x.setAttribute('aria-selected','false'));b.setAttribute('aria-selected','true');paintSegs($('[data-seg="peques"]',form));$('#rango',form).classList.toggle('hide',b.dataset.p!=='rango')}));
  $('#nv-abierto',form).addEventListener('change',e2=>{const off=e2.target.checked;$('#nv-plazas',form).disabled=off;$('#plazas-note',form).innerHTML=ic(off?'info':'alert')+`<span>${off?' No declara aforo: se podrá inscribir gente sin control':' Las plazas son obligatorias: si son ilimitadas, escribe 999'}</span>`;$('#plazas-note',form).style.color=off?'var(--sol)':''});
  $('#nv-coche',form).addEventListener('change',e2=>$('#coche-pz',form).classList.toggle('hide',!e2.target.checked));
  $$('[data-fld]',form).forEach(b=>b.addEventListener('click',()=>{const map={plazas:'#nv-plazas',coche:'#nv-coche-p'};const inp=$(map[b.dataset.fld]);inp.value=Math.max(+inp.min||0,Math.min(+inp.max||999,+inp.value+ +b.dataset.s))}));

    if(!fv(form,"hora"))errs.push('Falta la hora de salida.');
    if(!fv(form,"vuelta"))errs.push('Falta la hora de vuelta.');else if(fv(form,"hora")&&fv(form,"vuelta")===fv(form,"hora"))mark('vuelta','La vuelta no puede ser a la misma hora que la salida.');
    if(!fv(form,"cat"))errs.push('Falta la categoría');
    if(!fv(form,"sub").trim())errs.push('Falta la subcategoría');
    if(!fv(form,"lugar").trim())mark('lugar','Falta el punto de encuentro: nadie adivina dónde es.');
    const dsc=fv(form,"desc").trim();if(dsc.length<20)mark('desc','La descripción tiene que tener entre 20 y 4000 caracteres.');
    if(+fv(form,"precio")<0)mark('precio','El precio no puede ser negativo.');
    const abierto=$('#nv-abierto',form).checked;
    const plz=+fv(form,"plazas");
    if(!abierto&&(!plz||plz<1||plz>400))mark('plazas','El aforo va de 1 a 400 plazas (o 999 para ilimitado).');
    if(fv(form,"cat")==='montana'){const km=+fv(form,"km"),dn=+fv(form,"desnivel"),df=+$('#nv-dif',form).value;
      if(!(km>0)||!(dn>0))errs.push('En montaña hacen falta km, desnivel y dificultad.');}

    const box=$('#nv-errors',form);

      box.scrollIntoView({behavior:'smooth',block:'center'});toast(errs.length+' cosa'+(errs.length>1?'s':'')+' pendiente'+(errs.length>1?'s':'')+' en el formulario.','err');return}

      dificultad:fv(form,"cat")==='montana'?+$('#nv-dif',form).value:null,org:S.auth.userId,wa:!!fv(form,"wa"),coche:$('#nv-coche',form).checked?{ofrecidas:+$('#nv-coche-p',form).value,pedidas:0}:null,acompanantes:+$('#nv-acomp',form).value,version:1,canceladas:0};
    EVENTS.push(nv);
    const motivos=[];if(nv.cat==='montana'&&nv.dificultad>=4)motivos.push('Requiere nivel físico y no lo advierte');
    if(!abierto&&nv.plazas===null&&CFG.exigirAforo)motivos.push('Sin aforo: no se puede controlar');
    if(nv.vuelta&&nv.fecha&&diffD(hoy.toISOString().slice(0,10),nv.fecha)*24<CFG.antelacion)motivos.push('El sistema detecta fecha a menos de '+CFG.antelacion+' h');
    MODQ.unshift({id:'m'+uid(),ev:nv.id,motivos,enviado:hoy.toISOString().slice(0,10),autor:S.auth.userId});
    AUDIT.unshift({ts:'ahora',u:me().n,a:'quedada.propuesta',d:nv.id+' · '+nv.titulo});
    toast('Quedada enviada a moderación. Te avisamos aquí mismo, no solo por WhatsApp.','ok',5200);
    go('/quedada/'+nv.id);

  const catsSel=['montana','gastro','ocio'];
  const html=`
  <div class="wrap" style="max-width:820px">
    <div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:22px">
      <button class="avatar xl" data-act="avatar" style="background:${u.c};font-size:1.6rem" aria-label="Cambiar foto">${u.ini}</button>

      <div class="row" style="gap:8px"><button class="btn soft mini" data-act="avatar">${ic('image')} Cambiar mi foto</button><button class="btn soft mini" data-act="pass">${ic('lock')} Cambiar contraseña</button></div>
    </div>
    <div class="grid g2" style="margin-top:18px;align-items:start">
      <div class="stack">
        <div class="card"><h3 class="eyebrow" style="margin-bottom:10px">Mi ficha pública (la ven socios)</h3>
          <form id="frm-perf" class="stack" style="gap:12px">
            ${fld('muni','Municipio',{val:u.muni,help:'Se muestra en tu zona: con él se saben las quedadas de tu comarca'})}
            <div class="grid-form f2"><div class="campo" data-f="zona"><select id="f-zona-s" name="zona-sel">${Object.keys(COMARCAS).map(z=>`<option ${z===u.zona?'selected':''}>${z}</option>`).join('')}</select><label for="f-zona-s">Comarca</label></div></div>
            ${fld('bio','Presentación corta',{textarea:true,rows:3,max:600,val:'Me gusta el monte, la mesa larga y las horas de vuelta puntual.'})}
            <span class="eyebrow" style="margin-top:4px">Categorías que me interesan</span>
            <div class="row wrap" style="gap:8px">${Object.entries(CATS).map(([k,c])=>`<button type="button" class="chip sm ${catsSel.includes(k)?'on':''}" data-act="tcat">${ic(c.i)}${c.n}</button>`).join('')}</div>
            <button class="btn" type="submit">${ic('check')} Guardar</button>
          </form></div>
        <div class="card"><h3 class="eyebrow" style="margin-bottom:8px">Reputación</h3>
          <div class="grid g2" style="gap:12px">
            <div class="kpi"><div class="v">${u.part}</div><div class="l">${ic('cal-check')} Quedadas vividas</div></div>
            <div class="kpi"><div class="v" style="color:${u.faltas>2?'var(--peligro)':'var(--ok)'}">${u.entradas? Math.max(88,100-u.faltas*3):100}%</div><div class="l">${ic('shield')} Asistencia ${u.faltas?'· '+u.faltas+' ausencia(s)':''}</div></div>
          </div>
          <div class="notice info" style="margin-top:12px">${ic('info')}<span>Para proponer quedadas hacen falta 3 vividas: tú tienes ${u.part}.</span></div></div>
      </div>
      <div class="stack">
        <div class="card"><h3 class="eyebrow" style="margin-bottom:6px">Ajustes de cuenta</h3>
          <label class="fswitch"><span><span class="t">Avisarme por email cuando se libera una plaza en la lista de espera</span><span class="d">Esto sustituye a «entrar cada dos días a mirar la lista entera».</span></span><input type="checkbox" checked><i class="sw"></i></label>
          <label class="fswitch"><span><span class="t">Verificación en dos pasos (2FA)</span><span class="d">La 2FA se activa en el siguiente paso del asistente; aquí solo el interruptor.</span></span><input type="checkbox"><i class="sw"></i></label>
          <hr class="divider">
          <div class="stack" style="gap:8px">
            <button class="btn soft w-full" data-act="sessions">${ic('user')} Cerrar el resto de sesiones (2)</button>
            <button class="btn soft w-full" data-act="export">${ic('download')} Descargar mis datos (RGPD)</button>
            <button class="btn danger ghost w-full" data-act="salir">${ic('logout')} Cerrar sesión</button>
          </div></div>
        <div class="card" style="background:var(--sink);border-style:dashed">
          <h3 class="eyebrow">Contraseña</h3>
          <p class="small muted" style="margin:6px 0 10px">Cambia tu contraseña actual, desde esta misma pantalla. Al hacerlo, caducan todas las sesiones menos esta.</p>
          <button class="btn ghost w-full" data-act="pass">${ic('key')} Cambiar contraseña</button></div>
      </div>
    </div>
  </div>`;
  shell(html,{back:false,title:''});
  $$('[data-act="tcat"]',view).forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('on')}));
  $('#frm-perf',view).addEventListener('submit',e=>{e.preventDefault();toast('Ficha guardada. Tus futuros planes saldrán antes en tu comarca.','ok')});
  view.addEventListener('click',e=>{
    if(e.target.closest('[data-act="avatar"]')){
      openSheet({kind:'form',title:'Cambiar mi foto',dw:480,body:`
        <div class="center"><span class="avatar xl" style="margin:0 auto;background:${u.c}">${u.ini}</span>
        <div class="campo" style="margin-top:14px"><input type="file" id="foto-in" accept="image/*"><label class="lab-on" style="top:6px">Sube una imagen (máx 6 MB)</label></div>
        <div class="notice info" style="text-align:left;margin-top:10px">${ic('info')}<span>En este prototipo no se sube nada: sin backend. La app real valida tipo y peso («Ese archivo no es una imagen…» / «Máximo 6 MB…»).</span></div>
        <label class="cbx" style="text-align:left;margin-top:10px"><input type="checkbox"><span>Que mi foto no se use fuera de la comunidad (por defecto, sí)</span></label></div>`,
        foot:`<button class="btn ghost" data-act="sheet-close">Cancelar</button><button class="btn" id="foto-ok">Guardar foto</button>`,
        onMount:sh=>$('#foto-ok',sh).addEventListener('click',()=>{closeOverlay(sh.closest('.overlay'));toast('Foto simulada: aquí no hay servidor ni imágenes de socios reales.','info',4200)})});
    }
    if(e.target.closest('[data-act="pass"]'))passSheet();
    if(e.target.closest('[data-act="sessions"]'))confirmBox({title:'Cerrar el resto de sesiones',okText:'Cerrar todas',text:'Quedan fuera 2 dispositivos (móvil viejo y portátil). Esta sesión se mantiene abierta.',onOk:()=>toast('Cerradas todas las sesiones menos esta.','ok')});
    if(e.target.closest('[data-act="export"]')){const blob=new Blob([JSON.stringify({usuario:u,inscripciones:REVS.map(([i,r])=>({id:i,...r}))},null,2)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='adyp-datos-marina.json';a.click();toast('Descarga simulada lista: tus datos, en JSON.','ok')}
    if(e.target.closest('[data-act="salir"]')){S.auth=null;localStorage.removeItem('adyp_auth');go('/entrada')}
  });
}
function passSheet(){
  openSheet({kind:'form',title:'Cambiar contraseña',dw:480,body:`
    <form id="frm-pass" class="stack" style="gap:12px" novalidate>
      ${fld('actual','Contraseña actual',{type:'password',pw:true,help:'Con tu contraseña actual, desde esta misma pantalla.'})}
      ${fld('nueva','Contraseña nueva (mínimo 4)',{type:'password',pw:true})}
      ${fld('repite','Repite la contraseña nueva',{type:'password',pw:true})}
    </form>`,
    foot:`<button class="btn ghost" data-act="sheet-close">Cancelar</button><button class="btn" id="pass-ok">Cambiar contraseña</button>`,
    onMount:sh=>{
      $('#pass-ok',sh).addEventListener('click',()=>{
        const f=$('#frm-pass',sh);const bad=[];
        const mark=n=>{$('[data-f="'+n+'"]',f).classList.add('bad');};
        const msg=(n,m)=>{const er=$('[data-f="'+n+'"] .err',f);if(er)er.innerHTML='<span>'+m+'</span>'};
        if(!fv(f,"actual"))bad.push(mark('actual'),msg('actual','Falta la contraseña actual.'));
        if(fv(f,"nueva").length<4)bad.push(mark('nueva'),msg('nueva','La contraseña nueva necesita al menos 4 caracteres.'));
        else if(fv(f,"nueva").length>72)bad.push(mark('nueva'),msg('nueva','La contraseña nueva es demasiado larga (máximo 72).'));
        if(fv(f,"nueva")!==fv(f,"repite"))bad.push(mark('repite'),msg('repite','La repetición no coincide con la contraseña nueva.'));
        if(bad.length){toast('No se pudo: revisa el mensaje arriba','err');return}
        closeOverlay(sh.closest('.overlay'));toast('Contraseña cambiada: a partir de ahora entras con la tuya. Cerradas todas las sesiones menos esta.','ok',5200)});
    }});
}
</script>
<script>
/* ============ MAPA (simulado, sin Google) ============ */
function project(e){return {x:66+(e.lng*-1)*26,y:52-(e.lat-38.35)*72}}
function vMapa(){
  if(!S.auth)return vEntrada();
  const scope=S.mapScope;
  const list=EVENTS.filter(e=>scope==='todas'||(scope==='prox'&&abierto(e))||(scope==='pasadas'&&!abierto(e)));
  const html=`
  <div class="wrap">
    <div class="row sb" style="align-items:flex-start"><div><span class="eyebrow">Mapa de quedadas</span>
      <h1 class="display" style="font-size:var(--fs-xl)">Dónde nos vemos</h1></div>
      ${seg('scope',['Solo próximas','Próximas y pasadas','Todas'])}</div>
    <div class="row" style="gap:8px;margin:10px 0"><span class="sim-tag">${ic('info')} Mapa simulado · no es Google Maps</span>
      <span class="small dim">Esquema local sobre coordenadas reales de demo · «Cómo llegar» real exigiría la API de Maps</span></div>
    <div class="map-shell" id="map-shell">
      ${mapSVG(list)}
      <div class="map-ui">
        <button data-act="z-in" aria-label="Acercar">${ic('plus')}</button>
        <button data-act="z-out" aria-label="Alejar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button data-act="z-fit" aria-label="Encuadre general">${ic('refresh')}</button>
      </div>
      <div class="map-legend">${Object.entries(CATS).slice(0,6).map(([k,c])=>`<span><i style="background:${c.c}"></i>${c.n}</span>`).join('')}</div>
    </div>
    <p class="small dim center" style="margin-top:10px">Arrastra para desplazar · toca un chincheta para ver la tarjeta · pin doble = zoom</p>
  </div>`;
  shell(html,{back:false,title:''});
  const s=$('[data-seg="scope"]',view);s._on=i=>{S.mapScope=['prox','both','todas'][i];render()};
  initMapInteract(list);
}
let MAPV={x:-10,y:-10,w:140};
function mapSVG(list){
  const pins=[];const groups={};
  list.forEach(e=>{const{x,y}=project(e);const key=Math.round(x/9)+'_'+Math.round(y/9);(groups[key]=groups[key]||[]).push(e)});
  const comarcaShapes=Object.entries(COMARCAS).map(([z,c])=>{
    const cx=c.x*1.2,cy=c.y;const n=list.filter(e=>e.z===z).length;
    return `<g opacity=".85"><path d="M${cx-11} ${cy} q3-9 11-9 t11 9 q-2 8-11 8 t-11-8Z" fill="rgba(20,82,63,.07)" stroke="rgba(20,82,63,.28)" stroke-dasharray="2 3"/>
    <text x="${cx}" y="${cy+1}" text-anchor="middle" style="font-size:4.4px;fill:rgba(20,82,63,.66);font-weight:700">${z.toUpperCase()}</text>
    ${n?`<text x="${cx}" y="${cy+6}" text-anchor="middle" style="font-size:3.6px;fill:rgba(20,82,63,.5)">${n} plan${n>1?'es':''}</text>`:''}</g>`}).join('');
  Object.entries(groups).forEach(([k,arr])=>{
    const e=arr[0];const{x,y}=project(e);
    if(arr.length>1)pins.push(`<g class="pin pop" data-act="cluster" data-ids="${arr.map(a=>a.id).join(',')}" tabindex="0" role="button" aria-label="${arr.length} quedadas en este punto">
      <circle cx="${x}" cy="${y}" r="6" fill="var(--pino)" stroke="#fff" stroke-width="1.2"/><text x="${x}" y="${y+1.7}" class="cluster-lbl" style="font-size:4.5px">${arr.length}</text></g>`);
    else pins.push(`<g class="pin pop" data-act="pin" data-id="${e.id}" tabindex="0" role="button" aria-label="${esc(e.titulo)}">
      <path d="M${x} ${y-9}c-3 0-5.4 2.4-5.4 5.4 0 3.8 5.4 8.6 5.4 8.6s5.4-4.8 5.4-8.6C${x+5.4} ${y-6.6} ${x+3} ${y-9} ${x} ${y-9}Z" fill="${CATS[e.cat].c}" stroke="#fff" stroke-width="1"/>
      <circle cx="${x}" cy="${y-3.6}" r="2" fill="#fff"/><rect class="hit" x="${x-9}" y="${y-12}" width="18" height="22" rx="4"/></g>`)});
  return `<svg class="map" id="map-svg" viewBox="${MAPV.x} ${MAPV.y} ${MAPV.w} ${MAPV.w*0.72}" preserveAspectRatio="xMidYMid slice" role="application" aria-label="Mapa esquemático de la provincia con chinchetas de quedadas">
    <rect x="-40" y="-40" width="220" height="180" fill="#e9efe9"/>
    <path d="M-40 108 Q30 92 66 112 T180 100 V140 H-40Z" fill="#cfe6ea"/>
    <path d="M-40 118 Q30 102 66 122 T180 110" stroke="rgba(14,134,168,.5)" stroke-width="1.4" fill="none"/>
    <g opacity=".5" stroke="#c2d3c6" fill="none" stroke-width=".8"><path d="M6 40c14-6 22 8 34-2"/><path d="M40 18c10 6 18-4 26 4"/></g>
    ${comarcaShapes}${pins}
  </svg>`;
}
function initMapInteract(list){
  const svg=$('#map-svg',view);if(!svg)return;
  let drag=null;
  svg.addEventListener('pointerdown',e=>{if(e.target.closest('.pin'))return;drag={x:e.clientX,y:e.clientY,vx:MAPV.x,vy:MAPV.y};svg.setPointerCapture(e.pointerId)});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const s=MAPV.w/svg.clientWidth;
    MAPV.x=drag.vx-(e.clientX-drag.x)*s;MAPV.y=drag.vy-(e.clientY-drag.y)*s;
    svg.setAttribute('viewBox',`${MAPV.x} ${MAPV.y} ${MAPV.w} ${MAPV.w*0.72}`)});
  svg.addEventListener('pointerup',()=>drag=null);
  const zoom=f=>{MAPV.w=Math.max(46,Math.min(200,MAPV.w*f));svg.setAttribute('viewBox',`${MAPV.x} ${MAPV.y} ${MAPV.w} ${MAPV.w*0.72}`)};
  $('[data-act="z-in"]',view).addEventListener('click',()=>zoom(.75));
  $('[data-act="z-out"]',view).addEventListener('click',()=>zoom(1.3));
  $('[data-act="z-fit"]',view).addEventListener('click',()=>{MAPV={x:-10,y:-10,w:140};svg.setAttribute('viewBox','-10 -10 140 100.8')});
  view.addEventListener('click',e=>{
    const pin=e.target.closest('[data-act="pin"]');if(pin)return pinCard(pin.dataset.id);
    const cl=e.target.closest('[data-act="cluster"]');if(cl){
      const ids=cl.dataset.ids.split(',');
      openSheet({kind:'filters',title:'Quedadas en este punto',
        body:ids.map(i=>{const ev2=ev(i);return `<a class="list-item" href="#/quedada/${i}" data-act="sheet-close"><span class="ic" style="background:${CATS[ev2.cat].c}22;color:${CATS[ev2.cat].c}">${ic(CATS[ev2.cat].i)}</span><span class="tx"><b>${esc(ev2.titulo)}</b><span>${fday(ev2.fecha)} · ${fmtPlazas(ev2).t}</span></span>${ic('chev-r','chev')}</a>`}).join('')})}
  });
  svg.addEventListener('dblclick',()=>zoom(.8));
}
function pinCard(id){
  const e=ev(id);
  openSheet({kind:'detail',title:'Punto de encuentro',body:`
    <div style="border-radius:18px;overflow:hidden;height:120px;position:relative;margin-bottom:12px">${art(e,600,240)}
      <span class="pill" style="position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92)">${CATS[e.cat].n}</span></div>
    <h3 style="font-family:var(--ff-display);font-size:1.15rem;margin-bottom:6px">${esc(e.titulo)}</h3>
    <p class="small muted">${ffull(e.fecha)} · ${e.hora} · ${esc(e.lugar)}</p>
    <div class="row sb" style="margin-top:12px">${aforoEl(e)}<span class="pill ${fmtPlazas(e).k==='full'?'danger':'ok'}">${fmtPlazas(e).t}</span></div>`,
    foot:`<button class="btn ghost" id="pc-how">${ic('route')} Cómo llegar</button><a class="btn" href="#/quedada/${e.id}" data-act="sheet-close">Ver la ficha ${ic('chev-r')}</a>`,
    onMount:sh=>$('#pc-how',sh).addEventListener('click',()=>toast('Simulación: sin Google Maps, no hay rutas reales. En producción esto abre el navegador de mapas.','warn',4800))});
}
/* ============ MODERACIÓN ============ */
function vModeracion(){
  if(!S.auth)return vEntrada();
  if(!esEquipo()){view.className='';view.innerHTML=`<div class="wrap"><div class="empty"><div class="art">${ic('lock')}</div><h3>Este panel es para la organización</h3><p>Solo moderación y administración ven la cola. ¿Crees que es un error? Dile a Lorena.</p><a class="btn" href="#/">Volver al inicio</a></div></div>`;return}
  const rows=MODQ.map(q=>({q,e:ev(q.ev),autor:MEMBROS.find(m=>m.id===q.autor)})).filter(r=>r.e);
  const html=`
  <div class="wrap" style="max-width:920px">
    <div class="row sb" style="align-items:flex-start"><div><span class="eyebrow">Cola de moderación</span>
      <h1 class="display" style="font-size:var(--fs-2xl)">${rows.length} propuesta${rows.length===1?'':'s'} esperando</h1></div>
      <span class="pill ${rows.length?'warn':'ok'}">${ic('clock')}${rows.length?'con prisa':'todo limpio'}</span></div>
    <div class="notice info" style="margin:14px 0"><span>${ic('qr-scan')}</span><span><b>Validador de acceso:</b> cada QR caduca a las 12 h y solo funciona una vez. Pruébalo abajo (simulado, por supuesto).</span></div>
    ${demoGate({
      ok:rows.length?rows.map(({q,e,autor})=>`
      <div class="mod-item" style="margin-bottom:16px">
        <div class="row sb"><span class="row" style="gap:10px"><span class="avatar sm" style="background:${autor.c}">${autor.ini}</span><span><b>${esc(e.titulo)}</b><br><span class="small dim">de ${esc(autor.n)} · enviada el ${fday(q.enviado)}</span></span></span>
          <span class="pill">Pendiente</span></div>
        ${q.motivos.length?`<div class="detect">${q.motivos.map(m=>`<span class="pill warn">${ic('alert')}${esc(m)}</span>`).join('')}</div>`:`<span class="pill ok">${ic('check')}El sistema no detecta avisos</span>`}
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <button class="btn soft mini" data-act="verficha" data-id="${e.id}">${ic('image')} Ver ficha completa</button>
          <div class="grow"></div>
          <button class="btn mini ghost" data-act="devolver" data-q="${q.id}">Devolver con motivo</button>
          <button class="btn mini danger ghost" data-act="rechazar" data-q="${q.id}">Rechazar</button>
          <button class="btn mini" data-act="aprobar" data-q="${q.id}">${ic('check')} Aprobar</button>
          <button class="btn mini danger" data-act="bloquear" data-q="${q.id}">${ic('shield')} Bloquear</button>
        </div>
      </div>`).join(''):EMPTY('check','No hay quedadas esperando. Buen trabajo.','Nada todavía: aprueba o rechaza algo arriba.')
      ,sk:`<div class="stack">${'<div class="sk card" style="height:150px"></div>'.repeat(2)}</div>`,
      empty:EMPTY('check','Cola vacía','No hay quedadas esperando. Buen trabajo.'),err:ERRLBL})}
    <div class="card" style="margin-top:20px">
      <h3 class="eyebrow" style="margin-bottom:10px">${ic('qr-scan')} Validar entrada (check-in)</h3>
      <div class="row" style="gap:10px;flex-wrap:wrap">
        <input id="qr-code" class="campo" placeholder="Código del QR (o pulsa un nombre)" style="min-height:48px;padding:12px 14px;border:1.5px solid var(--linea);border-radius:var(--r-input);background:var(--papel);flex:1;min-width:220px">
        <button class="btn" data-act="validar">Validar</button></div>
      <div class="row wrap" style="gap:8px;margin-top:12px">${MEMBROS.slice(0,5).map(m=>`<button class="chip sm" data-act="qr-name" data-c="ADYP-e1-${m.id}">${m.ini} ${esc(m.n.split(' ')[0])}</button>`).join('')}</div>
      <div id="qr-out"></div>
    </div>
  </div>`;
  shell(html,{back:false,title:''});
  view.addEventListener('click',e=>{
    const A=t=>e.target.closest('[data-act="'+t+'"]');
    let b;
    if(b=A('verficha')){openSheet({kind:'detail',title:'Ficha en una pestaña nueva (simulada)',body:`<div class="stack"><p class="small">Así la ves completa, sin perder la cola. Ficha real: <code>#/quedada/${b.dataset.id}</code></p><div>${qcard(ev(b.dataset.id))}</div><a class="btn w-full" href="#/quedada/${b.dataset.id}" data-act="sheet-close">Abrir la ficha entera</a></div>`});return}
    if(b=A('aprobar')){const q=MODQ.find(x=>x.id===b.dataset.q);const ee=ev(q.ev);
      confirmBox({title:'Aprobar «'+esc(ee.titulo)+'»',okText:'Aprobar y publicar',text:q.motivos.length?'Tiene avisos pendientes ('+q.motivos.length+'). Aprobar con avisos queda registrado en auditoría con tu nombre.':'Se publicará en la agenda desde hoy. Queda registrado en auditoría.',
        onOk:()=>{ee.estado='Aprobada';MODQ=MODQ.filter(x=>x.id!==q.id);AUDIT.unshift({ts:'ahora',u:me().n,a:'moderar.aprobar',d:ee.id+' · '+ee.titulo});render();toast('Aprobada y publicada. El autor recibe el aviso aquí y por WhatsApp.','ok')}});return}
    if(b=A('devolver')){devolverMotivo(b.dataset.q,'Devolver para corregir','Devuelta para corregir. No cuenta como rechazo. El autor puede editar y reenviar.');return}
    if(b=A('rechazar')){devolverMotivo(b.dataset.q,'Rechazar con motivo','Rechazada con motivo. El autor ve el motivo exacto y puede corregir y reenviar.','danger');return}
    if(b=A('bloquear')){confirmBox({title:'Bloquear propuesta',danger:true,okText:'Bloquear',
      text:'Bloqueada. Queda registrada en auditoría con tu nombre. El autor ve solo «bloqueada por el equipo».',
      onOk:()=>{const q=MODQ.find(x=>x.id===b.dataset.q);const ee=ev(q.ev);ee.estado='Bloqueada';MODQ=MODQ.filter(x=>x.id!==q.id);
        AUDIT.unshift({ts:'ahora',u:me().n,a:'moderar.bloquear',d:ee.id+' · '+ee.titulo});render();toast('Bloqueada y registrada en auditoría con tu nombre.','warn')}});return}
    if(b=A('validar')){qrValidar($('#qr-code',view).value.trim());return}

function devolverMotivo(qid,title,okMsg,style){
  const {close}=openSheet({kind:'form',title,dw:480,body:`
    <div class="stack" style="gap:12px">
      <div class="row wrap" style="gap:6px">${['Falta la hora de vuelta prevista','El enlace de WhatsApp es de otra actividad','Descripción demasiado corta para decidir','Sin aforo: no se puede controlar','Falta nivel de dificultad o desnivel en montaña'].map(m=>`<button class="chip sm" data-act="mot">${esc(m)}</button>`).join('')}</div>
      ${fld('mot','Motivo para el autor',{textarea:true,rows:3,help:'Se lo envías tal cual al autor. Sé concreto y amable.'})}
    </div>`,
    foot:`<button class="btn ghost" data-act="sheet-close">Cancelar</button><button class="btn ${style||''}" id="mot-ok">Enviar al autor</button>`,
    onMount:sh=>{
      sh.addEventListener('click',e2=>{const m=e2.target.closest('[data-act="mot"]');if(m){const t=$('#f_mot',sh);t.value=(t.value?t.value+'\n':'')+m.textContent;t.dispatchEvent(new Event('input'))}});

        if(t.length<12){$('[data-f="mot"]',sh).classList.add('bad');$('.err',$('[data-f="mot"]',sh)).innerHTML='<span>Un motivo de una línea no ayuda a nadie (mín. 12 caracteres).</span>';return}

        if(style==='danger'){ee.estado='Rechazada';NOTIFS.unshift({id:'n'+uid(),txt:'Tu quedada «'+ee.titulo+'» fue rechazada con motivo: '+t,new:true})}

        MODQ=MODQ.filter(x=>x.id!==qid);
        AUDIT.unshift({ts:'ahora',u:me().n,a:style==='danger'?'moderar.rechazar':'moderar.devolver',d:ee.id+' · '+t.slice(0,60)});

function qrValidar(code){
  const out=$('#qr-out',view);
  const m=code.match(/^ADYP-(e\d+|e\w+)-(\w+)$/);
  if(!m){out.innerHTML=`<div class="notice" style="background:var(--peligro-soft);color:var(--peligro);margin-top:12px">${ic('alert')}<span><b>QR no válido para esta quedada.</b> Formato esperado: <code>ADYP-&lt;evento&gt;-&lt;socio&gt;</code>. Prueba con un chip de arriba.</span></div>`;return}
  const e=ev(m[1]);if(!e){out.innerHTML=`<div class="notice" style="background:var(--peligro-soft);color:var(--peligro);margin-top:12px">${ic('alert')}<span>QR no válido: ese evento no existe en esta demo.</span></div>`;return}
  const u=MEMBROS.find(x=>x.id===m[2])||{n:'Visitante'};
  out.innerHTML=`<div class="notice" style="background:var(--ok-soft);color:var(--ok);margin-top:12px">${ic('check')}<span><b>Todo el mundo dentro.</b> ${esc(u.n)} ✓ en «${esc(e.titulo)}». Un solo uso (marcado como ya usado en esta demo).</span></div>`;
  toast('Check-in registrado: '+u.n,'ok');
}

      $('#del-ok',sh).addEventListener('click',()=>{

          $('[data-f="lit"]',sh).classList.add('bad');
          $('.err',$('[data-f="lit"]',sh)).innerHTML='<span>Confirmación literal: escribe ELIMINAR.</span>';
          return;
        }
        EVENTS=EVENTS.filter(x=>x.id!==ev_.id);
        AUDIT.unshift({ts:'ahora',u:me().n,a:'quedada.borrar',d:ev_.id});
        closeOverlay(sh.closest('.overlay'));
        render();
        toast('Eliminada. Asiento de auditoría registrado.','warn');
      });
    }});
}

function wireCfg(){
  $$('.stepper button',view).forEach(b=>b.addEventListener('click',()=>{const i=$('#cf-'+b.dataset.k);if(!i)return;i.value=Math.max(+i.min||0,Math.min(+i.max||999,+i.value+ +b.dataset.s))}));
  const save=$('#cfg-save',view);if(!save)return;
  save.addEventListener('click',()=>{
    const prev={...CFG};
    CFG.exigirAforo=$('#cf-af',view).checked;CFG.antelacion=+$('#cf-ant',view).value;
    CFG.acompanantesMax=+$('#cf-ac',view).value;CFG.caducidadWA=+$('#cf-wa',view).value;
    CFG.bienvenida=$('#f_bien',view).value;
    AUDIT.unshift({ts:'ahora',u:me().n,a:'ajustes.guardar',d:'antelacion_min_h = '+prev.antelacion+' → '+CFG.antelacion});

  });
}

  $('#trunc',view)?.addEventListener('click',()=>{$('#tr-out',view).classList.toggle('hide')});

<script>
/* ============ PROMPT COMPLETO ============ */
function vPrompt(){
  const txt=$('#prompt-src').textContent.trim();
  const html=`
  <div class="wrap" style="max-width:860px">
    <span class="eyebrow">Módulo de transparencia</span>
    <h1 class="display" style="font-size:var(--fs-xl);margin:4px 0 8px">Prompt completo</h1>
    <p class="lead" style="margin-bottom:14px">El encargo íntegro que generó este prototipo. Copiable, para poder reproducir la auditoría.</p>
    <div class="row" style="gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn" data-act="copy-prompt">${ic('copy')} Copiar prompt</button>
      <a class="btn ghost" href="${S.auth?'#/':'#/entrada'}">${ic('arrow-l')} ${S.auth?'Volver a la app':'Volver al acceso'}</a>
      <span class="sim-tag">${ic('info')} 0% APIs externas</span>
    </div>
    <div class="prompt-box"><pre id="prompt-pre">${esc(txt)}</pre></div>
    <div class="card" style="margin-top:16px"><h3 class="eyebrow" style="margin-bottom:8px">Notas de transparencia de esta maqueta</h3>
      <ul class="stack" style="gap:6px;font-size:var(--fs-sm)">
        <li>${ic('info')} <b>Sin backend PHP</b>: login, altas, moderación, aforo, colas y auditoría se simulan en memoria (reglas y textos copiados de la app real).</li>
        <li>${ic('info')} <b>Sin Google Maps</b>: el mapa es un esquema SVG local con coordenadas reales de demo; «Cómo llegar» está declarado como simulado.</li>
        <li>${ic('info')} <b>Sin SMS/email/WhatsApp</b>: los avisos «por WhatsApp» o «email al liberarse plaza» no salen del navegador.</li>
        <li>${ic('info')} <b>Fuentes</b>: se usan Fraunces/Jakarta/Outfit si están instaladas; si no, fallbacks del sistema (zero-CDN). En producción se sirven los <code>/fonts/*.woff2</code> locales.</li>
        <li>${ic('info')} <b>Fotos</b>: todas las portadas son arte generativo SVG; ningún socio real aparece.</li>
      </ul></div>
  </div>`;
  shell(html,{back:S.auth, title:S.auth?'':'', tab:false});
  $('[data-act="copy-prompt"]',view)?.addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(txt);toast('Prompt copiado al portapapeles ('+txt.length.toLocaleString('es-ES')+' caracteres).','ok')}
    catch{const r=document.createRange();r.selectNode($('#prompt-pre',view));const s=getSelection();s.removeAllRanges();s.addRange(r);
      try{document.execCommand('copy');toast('Prompt copiado (método clásico).','ok')}catch(e2){toast('Seleccionado: usa Ctrl/Cmd+C para copiar.','info')}}});
}
function v404(){
  view.className='';
  view.innerHTML=`<div class="wrap center" style="padding-top:calc(var(--hd-standoff) + 40px)"><h1 class="display" style="font-size:var(--fs-3xl)">404</h1>
  <p class="lead">No encontramos esa pantalla. Como en la app real: todo lo desconocido vuelve al acceso.</p>
  <div class="row" style="justify-content:center;margin-top:14px"><a class="btn" href="${S.auth?'#':'#/entrada'}">Llévame de vuelta</a></div></div>`;
}
/* ============ ROUTER ============ */
function curRoute(){return location.hash.replace(/^#/,'')||'/'}
function render(){
  const [name,id]=parseHash();
  const gated=['inicio','agenda','mapa','quedada','nueva','mis','comunidad','perfil','moderacion','admin'];
  if(!S.auth&&gated.includes(name)){vEntrada();return}
  if(S.auth&&name==='entrada'){go('/',{replace:true});return}
  switch(name){
    case 'inicio':vInicio();break;
    case 'entrada':vEntrada();break;
    case 'unirme':vUnirme();break;
    case 'agenda':vAgenda();break;
    case 'mapa':vMapa();break;
    case 'quedada':id?vQuedada(id):vNueva();break;
    case 'nueva':vNueva();break;
    case 'mis':vMis();break;
    case 'comunidad':vComunidad();break;
    case 'perfil':vPerfil();break;
    case 'moderacion':vModeracion();break;
    case 'admin':vAdmin(id||'resumen');break;
    case 'prompt':vPrompt();break;
    default:v404();
  }
  window.scrollTo({top:0});
}
/* ============ DOCK CONCEPTO A/B/C ============ */
const CONCEPT_NAMES={a:'A · Glass minimalista',b:'B · Comunidad vibrante',c:'C · Neo-editorial'};
(function mountDock(){
  const dock=document.createElement('aside');
  dock.className='conceptdock';dock.setAttribute('role','group');dock.setAttribute('aria-label','Conmutador de conceptos visuales A/B/C');
  dock.innerHTML=`<span class="lab">A/B/C</span>`+['a','b','c'].map(k=>`<button data-act="concept" data-k="${k}" title="${CONCEPT_NAMES[k]}" aria-label="Aplicar concepto ${CONCEPT_NAMES[k]}" aria-pressed="${S.concept===k}">${k.toUpperCase()}</button>`).join('');
  document.body.appendChild(dock);
  dock.addEventListener('click',e=>{
    const b=e.target.closest('[data-act="concept"]');if(!b)return;
    S.concept=b.dataset.k;setLS('concept',S.concept);
    document.documentElement.dataset.concept=S.concept;
    $$('[data-act="concept"]',dock).forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.k===S.concept)));
    toast('Concepto <b>'+CONCEPT_NAMES[S.concept]+'</b> aplicado a esta ruta y a todas las demás.','info',2600);
    paintSegs();
  });
})();
addEventListener('hashchange',render);
addEventListener('resize',()=>{paintSegs()});
if(!location.hash)location.hash=S.auth?'#/':'#/entrada';
render();
</script>
</body>
</html>
